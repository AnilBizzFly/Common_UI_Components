<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetic Beam</title>
<style>
@property --beam{syntax:'<angle>';inherits:false;initial-value:0deg}

*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:52px;padding:40px 20px;overflow:hidden;
  font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e8ecf7;background:#04060d;
}
/* a grid that only exists where the cursor is */
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(120,160,255,.16) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(120,160,255,.16) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask:radial-gradient(340px circle at var(--px,50%) var(--py,50%),#000 5%,transparent 72%);
          mask:radial-gradient(340px circle at var(--px,50%) var(--py,50%),#000 5%,transparent 72%)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(420px circle at var(--px,50%) var(--py,50%),rgba(90,120,255,.16),transparent 70%)}

.head{position:relative;z-index:2;text-align:center}
.head p:first-child{margin:0 0 10px;font:600 10px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.3em;color:rgba(255,255,255,.38)}
.head h1{margin:0 0 8px;font-size:clamp(28px,7vw,44px);font-weight:600;letter-spacing:-.045em}
.head p:last-child{margin:0;font-size:14px;color:rgba(255,255,255,.5)}

/* ============ the magnet ============ */
.field{position:relative;z-index:2;display:grid;place-items:center;width:340px;height:150px}

.mag{
  position:relative;isolation:isolate;padding:20px 44px;border:0;border-radius:18px;cursor:pointer;
  font:inherit;font-size:16px;font-weight:650;letter-spacing:-.01em;color:#eaf0ff;
  background:#0b1020;
  box-shadow:0 20px 50px -18px rgba(80,110,255,.55), 0 0 0 1px rgba(255,255,255,.05) inset;
  /* the pull is a transform, so it never touches layout */
  translate:var(--tx,0px) var(--ty,0px);
  transition:translate .5s cubic-bezier(.2,1.5,.4,1), scale .35s cubic-bezier(.2,1.5,.4,1);
}
.mag.pulled{transition:translate .12s linear}
.mag:hover{scale:1.06}
.mag:active{scale:.97}
.mag:focus-visible{outline:2px solid #6f9cff;outline-offset:6px}

/* the beam: one bright arc of a conic, forever turning */
.mag::before{
  content:"";position:absolute;inset:-1.5px;border-radius:inherit;z-index:-1;
  background:conic-gradient(from var(--beam),transparent 0 62%,#4f7dff 78%,#a855f7 88%,#22d3ee 96%,transparent 100%);
  animation:beam 3.4s linear infinite;
  filter:blur(.3px);
}
@keyframes beam{to{--beam:360deg}}
/* the mask that leaves only the rim lit */
.mag::after{
  content:"";position:absolute;inset:0;border-radius:inherit;background:#0b1020;z-index:-1;
}

.mag .lbl{position:relative;display:flex;align-items:center;gap:11px;
  /* the label lags the shell, which is what sells the depth */
  translate:var(--lx,0px) var(--ly,0px);
  transition:translate .55s cubic-bezier(.2,1.4,.4,1)}
.mag.pulled .lbl{transition:translate .16s linear}
.mag svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* the halo that leaks out under it while it is being pulled */
.mag .halo{position:absolute;inset:-30px;border-radius:34px;z-index:-2;opacity:0;
  background:radial-gradient(closest-side,rgba(79,125,255,.5),transparent 72%);
  transition:opacity .4s}
.mag.pulled .halo{opacity:1}

/* release: the beam blows outward once */
.shock{position:absolute;inset:0;border-radius:inherit;border:1.5px solid #6f9cff;
  opacity:0;pointer-events:none}
.mag.fire .shock{animation:shock .72s cubic-bezier(.2,.8,.3,1)}
@keyframes shock{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}

.readout{position:relative;z-index:2;font:600 10px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.readout b{color:#6f9cff}

@media (prefers-reduced-motion:reduce){
  .mag::before{animation:none}
  .mag,.mag .lbl{transition:none}
}
</style>
</head>
<body>

<div class="grid" id="grid" aria-hidden="true"></div>
<div class="glow" id="glow" aria-hidden="true"></div>

<div class="head">
  <p>03 &middot; MAGNETIC</p>
  <h1>It leans toward you</h1>
  <p>Shell and label pull at different rates, so the button gains a front and a back.</p>
</div>

<div class="field" id="field">
  <button class="mag" id="mag" type="button">
    <span class="halo"></span><span class="shock"></span>
    <span class="lbl">
      <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6Z"/></svg>
      Get started
    </span>
  </button>
</div>

<p class="readout" id="readout">pull <b>0px</b></p>

<script>
const mag = document.getElementById('mag'), field = document.getElementById('field'),
      readout = document.getElementById('readout'), lbl = mag.querySelector('.lbl');

const RANGE = 130;    // how far away it starts to notice you
const PULL  = 0.34;   // how much of the gap the shell closes
const LAG   = 0.18;   // the label closes less, so it trails behind

addEventListener('pointermove', e => {
  document.documentElement.style.setProperty('--px', e.clientX + 'px');
  document.documentElement.style.setProperty('--py', e.clientY + 'px');
  if (e.pointerType !== 'mouse') return;

  const r = mag.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const d = Math.hypot(dx, dy);

  if (d < RANGE){
    const k = 1 - d / RANGE;                  // strongest at the centre
    mag.classList.add('pulled');
    mag.style.setProperty('--tx', (dx * PULL).toFixed(1) + 'px');
    mag.style.setProperty('--ty', (dy * PULL).toFixed(1) + 'px');
    lbl.style.setProperty('--lx', (dx * LAG).toFixed(1) + 'px');
    lbl.style.setProperty('--ly', (dy * LAG).toFixed(1) + 'px');
    readout.innerHTML = 'pull <b>' + Math.round(Math.hypot(dx * PULL, dy * PULL)) + 'px</b>';
  } else if (mag.classList.contains('pulled')){
    release();
  }
});

function release(){
  mag.classList.remove('pulled');            // slow spring takes over from the linear follow
  mag.style.setProperty('--tx', '0px'); mag.style.setProperty('--ty', '0px');
  lbl.style.setProperty('--lx', '0px'); lbl.style.setProperty('--ly', '0px');
  readout.innerHTML = 'pull <b>0px</b>';
}
addEventListener('pointerleave', release);

mag.addEventListener('click', () => {
  mag.classList.remove('fire'); void mag.offsetWidth; mag.classList.add('fire');
});
</script>
</body>
</html>
