<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send</title>
<style>
:root{--bg:#070c18;--card:#131c2e;--line:rgba(255,255,255,.08);
--txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;
--a:#5ad2ff;--b:#7c8cff;--ok:#5fe0ac;--ease:cubic-bezier(.25,1,.5,1)}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:26px;padding:30px 20px;font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color:var(--txt);background:var(--bg)}
body::before{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(150px);
background:rgba(90,210,255,.11);top:-26vmax;left:50%;margin-left:-30vmax;pointer-events:none}

.head{text-align:center;z-index:1}
.head p:first-child{margin:0 0 7px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--faint)}
.head h1{margin:0 0 5px;font-size:21px;letter-spacing:-.03em}
.head p:last-child{margin:0;font-size:13px;color:var(--dim)}

.box{position:relative;z-index:1;width:min(380px,100%);padding:14px;border-radius:20px;
background:linear-gradient(168deg,var(--card),#0d1422);border:1px solid var(--line);
box-shadow:0 30px 66px -28px rgba(0,0,0,.86)}
.box textarea{width:100%;height:76px;padding:11px 13px;resize:none;font:inherit;font-size:14px;
color:var(--txt);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;outline:none;
transition:border-color .2s,box-shadow .2s}
.box textarea::placeholder{color:var(--faint)}
.box textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(90,210,255,.14)}

/* ---------- the button ---------- */
.send{position:relative;width:100%;height:48px;margin-top:11px;overflow:hidden;
font:inherit;font-size:14.5px;font-weight:700;color:#06131f;
background:linear-gradient(115deg,var(--a),var(--b));border:0;border-radius:14px;cursor:pointer;
box-shadow:0 14px 30px -12px rgba(90,210,255,.7);
transition:transform .15s,background .4s var(--ease),box-shadow .3s}
.send:hover:not(:disabled){transform:translateY(-2px)}
.send:active:not(:disabled){transform:translateY(1px)}
.send:disabled{cursor:default}
.send .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;
transition:opacity .2s,transform .3s var(--ease)}
.send.flying .lbl{opacity:0}
/* landed must hide it too — removing .flying was letting the old label back in */
.send.landed .lbl{opacity:0;transform:scale(.94)}
.send.landed{background:linear-gradient(115deg,var(--ok),#4bc7ff)}

/* the plane rides a motion path — the flight is one CSS property, not a script */
.plane{position:absolute;left:0;top:0;width:19px;height:19px;
offset-path:path("M 24 24 C 90 -14, 210 4, 300 -46");
offset-distance:0%;offset-rotate:auto;
opacity:0;pointer-events:none}
.plane svg{width:100%;height:100%;fill:#06131f}
.send.flying .plane{animation:takeoff .82s cubic-bezier(.55,0,.7,.25) forwards}
@keyframes takeoff{
  0%{offset-distance:0%;opacity:1;scale:1}
  70%{opacity:1}
  100%{offset-distance:100%;opacity:0;scale:.5}
}
/* the vapour it leaves behind */
.trail{position:absolute;left:20px;top:22px;height:2px;width:0;border-radius:2px;
background:linear-gradient(90deg,transparent,rgba(6,19,31,.55));opacity:0}
.send.flying .trail{animation:vapour .82s cubic-bezier(.55,0,.7,.25) forwards}
@keyframes vapour{0%{width:0;opacity:.9}55%{width:150px;opacity:.5}100%{width:230px;opacity:0}}

.send .yes{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;
opacity:0;transform:scale(.85);transition:opacity .24s,transform .4s cubic-bezier(.34,1.5,.4,1)}
.send .yes svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.8;
stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26}
.send.landed .yes{opacity:1;transform:none}
.send.landed .yes svg{transition:stroke-dashoffset .38s ease .1s;stroke-dashoffset:0}

.readout{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;
text-transform:uppercase;color:var(--faint);z-index:1}
.readout b{color:var(--a)}
@media (prefers-reduced-motion:reduce){.plane,.trail{animation:none!important}}
</style>
</head>
<body>

<div class="head">
  <p>BUTTON 04</p><h1>Send</h1>
  <p>The plane rides a CSS motion path &mdash; the flight is one property.</p>
</div>

<div class="box">
  <textarea id="msg" placeholder="Say something to the team…">Ship it — the index rebuild looks good on staging.</textarea>
  <button class="send" id="send" type="button">
    <span class="lbl">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
           stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      Send message
    </span>
    <span class="trail"></span>
    <span class="plane"><svg viewBox="0 0 24 24"><path d="M22 2 2 10.5l7.5 2.6L12.5 21Z"/></svg></span>
    <span class="yes"><svg viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></svg>Sent</span>
  </button>
</div>

<p class="readout" id="readout">message <b>draft</b></p>

<script>
const send = document.getElementById('send'), msg = document.getElementById('msg'),
      readout = document.getElementById('readout');
const wait = ms => new Promise(r => setTimeout(r, ms));
let busy = false;

send.addEventListener('click', async () => {
  if (busy || !msg.value.trim()) { msg.focus(); return; }
  busy = true; send.disabled = true;

  send.classList.add('flying');
  readout.innerHTML = 'message <b>in flight</b>';
  await wait(820);

  send.classList.remove('flying');
  send.classList.add('landed');
  msg.value = '';
  readout.innerHTML = 'message <b>delivered</b>';

  await wait(1700);
  send.classList.remove('landed');
  send.disabled = false; busy = false;
  readout.innerHTML = 'message <b>draft</b>';
});
</script>
</body>
</html>
