<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow</title>
<style>
:root{--bg:#080c17;--card:#141b2b;--line:rgba(255,255,255,.08);
--txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;
--a:#7cc4ff;--b:#a98bff;--ok:#5fe0ac;--ease:cubic-bezier(.25,1,.5,1)}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:26px;padding:30px 20px;font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color:var(--txt);background:var(--bg)}
body::before{content:"";position:fixed;width:58vmax;height:58vmax;border-radius:50%;filter:blur(150px);
background:rgba(169,139,255,.12);top:-24vmax;left:50%;margin-left:-29vmax;pointer-events:none}

.head{text-align:center;z-index:1}
.head p:first-child{margin:0 0 7px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--faint)}
.head h1{margin:0 0 5px;font-size:21px;letter-spacing:-.03em}
.head p:last-child{margin:0;font-size:13px;color:var(--dim)}

.person{position:relative;z-index:1;display:flex;align-items:center;gap:13px;width:min(360px,100%);
padding:15px;border-radius:20px;background:linear-gradient(168deg,var(--card),#0e1422);
border:1px solid var(--line);box-shadow:0 30px 66px -28px rgba(0,0,0,.86)}
.av{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
background:linear-gradient(140deg,var(--a),var(--b));color:#07121d;font:800 16px/1 ui-sans-serif}
.who{flex:1;min-width:0}
.who b{display:block;font-size:14px;font-weight:600}
.who span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- the button ---------- */
/* the width is the animation: it shrinks to fit the shorter word, then grows back */
.follow{position:relative;height:38px;padding:0 18px;flex:0 0 auto;overflow:hidden;
font:inherit;font-size:13px;font-weight:700;color:#07121d;
background:#e9edf8;border:1px solid transparent;border-radius:99px;cursor:pointer;
transition:width .42s var(--ease),background .34s var(--ease),color .3s,border-color .34s}
.follow:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.follow span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;
white-space:nowrap;transition:opacity .2s,transform .34s var(--ease)}
.follow svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;
stroke-linecap:round;stroke-linejoin:round}
.follow .off{opacity:1}
.follow .on{opacity:0;transform:translateY(105%)}
.follow .on svg{stroke-dasharray:26;stroke-dashoffset:26}

.follow[aria-pressed="true"]{background:transparent;color:var(--mut);border-color:var(--line)}
.follow[aria-pressed="true"] .off{opacity:0;transform:translateY(-105%)}
.follow[aria-pressed="true"] .on{opacity:1;transform:none}
.follow[aria-pressed="true"] .on svg{transition:stroke-dashoffset .4s ease .12s;stroke-dashoffset:0}
.follow[aria-pressed="true"]:hover{color:#ff8fa8;border-color:rgba(255,143,168,.4);background:rgba(255,143,168,.08)}

.pulse{position:absolute;inset:0;border-radius:99px;border:2px solid var(--a);
opacity:0;transform:scale(1);pointer-events:none}
.follow.just .pulse{animation:out .55s cubic-bezier(.2,.8,.3,1)}
@keyframes out{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}

.readout{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;
text-transform:uppercase;color:var(--faint);z-index:1}
.readout b{color:var(--a)}
@media (prefers-reduced-motion:reduce){.follow,.follow *{transition-duration:.01ms}}
</style>
</head>
<body>

<div class="head">
  <p>BUTTON 05</p><h1>Follow</h1>
  <p>The width is measured, not guessed &mdash; so the pill fits either word.</p>
</div>

<div class="person">
  <span class="av">PR</span>
  <span class="who"><b>Priya Raman</b><span id="fc">2,481 followers</span></span>
  <button class="follow" id="follow" type="button" aria-pressed="false">
    <span class="pulse"></span>
    <span class="off"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Follow</span>
    <span class="on"><svg viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></svg><i class="word" style="font-style:normal">Following</i></span>
  </button>
</div>

<p class="readout" id="readout">state <b>not following</b></p>

<script>
const follow = document.getElementById('follow'), fc = document.getElementById('fc'),
      readout = document.getElementById('readout');
let on = false, n = 2481;

/* measure both labels once, so the width transition has real numbers to move between */
function widthOf(el){
  const probe = el.cloneNode(true);
  probe.style.cssText = 'position:absolute;visibility:hidden;inset:auto;display:inline-flex';
  document.body.appendChild(probe);
  const w = probe.getBoundingClientRect().width;
  probe.remove();
  return Math.ceil(w) + 36;              // + horizontal padding
}
const W = {
  off: widthOf(follow.querySelector('.off')),
  on:  widthOf(follow.querySelector('.on'))
};
follow.style.width = W.off + 'px';

follow.addEventListener('click', () => {
  on = !on;
  follow.setAttribute('aria-pressed', String(on));
  follow.style.width = (on ? W.on : W.off) + 'px';
  n += on ? 1 : -1;
  fc.textContent = n.toLocaleString() + ' followers';
  readout.innerHTML = 'state <b>' + (on ? 'following' : 'not following') + '</b>';
  if (on){ follow.classList.remove('just'); void follow.offsetWidth; follow.classList.add('just'); }
});
</script>
</body>
</html>
