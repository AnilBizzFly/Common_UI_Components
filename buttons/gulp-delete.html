<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gulp — delete button</title>
<style>
/* registered, so the level tweens instead of stepping */
@property --p { syntax:'<number>'; inherits:true; initial-value:0 }

:root{
  --bg:#080c17; --card:#141b2b; --card2:#0e1422; --line:rgba(255,255,255,.08);
  --txt:#e9edf8; --mut:#8b95b3; --dim:#5a6482; --faint:#3c4562;
  --bad:#ff5f6d; --bad-2:#ff8f5f; --ok:#5fe0ac;
  --ease:cubic-bezier(.25,1,.5,1);
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;padding:30px 20px;
  font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);background:var(--bg);
}
body::before{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(150px);
  background:rgba(255,95,109,.12);top:-24vmax;left:50%;margin-left:-30vmax;pointer-events:none}

.head{text-align:center;z-index:1}
.head p:first-child{margin:0 0 8px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--faint)}
.head h1{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}
.head p:last-child{margin:0;font-size:13px;color:var(--dim)}

/* ============ gulp ============ */
.gulp{
  --w:160px; --h:56px; --fx:0px; --rr:999px;
  position:relative;display:inline-block;z-index:1;
  width:var(--w);height:var(--h);
}
.gulp_body{position:absolute;inset:0}

/* the face and the button share one clip, so they collapse as one object */
.gulp_face, .gulp_btn{
  clip-path: inset(0 var(--fx) round var(--rr));
  transition: clip-path .44s cubic-bezier(.25,1,.5,1);
}
.gulp_face{
  position:absolute;inset:0;border-radius:var(--rr);
  background:linear-gradient(118deg,var(--bad),var(--bad-2));
  box-shadow:0 14px 32px -12px rgba(255,95,109,.7),inset 0 1px 0 rgba(255,255,255,.34);
}
.gulp_btn{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;
  font:inherit;font-size:15px;font-weight:700;letter-spacing:-.01em;color:#2a0810;
  background:none;border:0;cursor:pointer;padding:0;
}
.gulp_btn:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:var(--rr)}
.gulp[data-state="turn"] .gulp_btn,
.gulp[data-state="chew"] .gulp_btn{cursor:default}

.gulp_icon{width:26px;height:26px;flex:0 0 auto;overflow:visible}
.gulp_bin{fill:none;stroke:#2a0810;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.gulp_rib{fill:none;stroke:#2a0810;stroke-width:5;stroke-linecap:round;opacity:.45}

/* the lid lifts off its left hinge while the word is going in */
.gulp_lid{
  fill:none;stroke:#2a0810;stroke-width:7;stroke-linecap:round;
  transform-box:fill-box;transform-origin:6% 90%;
  transform:rotate(0deg) translateY(0);
  transition:transform .34s cubic-bezier(.34,1.5,.5,1);
}
.gulp[data-state="chew"] .gulp_lid{transform:rotate(-28deg) translateY(-3px)}

/* the level: one slide along a fixed 32° diagonal (46:29), scaled by --p */
.gulp_fill{
  fill:currentColor;color:#2a0810;opacity:.9;
  translate: calc(46px * var(--p)) calc(29px * var(--p));
  transition: translate .5s var(--ease);
}
.gulp_fill.slosh{animation:slosh .5s ease-out}
@keyframes slosh{
  0%{transform:translate(0,0) rotate(0deg)}
  35%{transform:translate(2.5px,-1.5px) rotate(2.6deg)}
  70%{transform:translate(-1.5px,.8px) rotate(-1.4deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}

/* the word comes apart and goes in */
.gulp_word{display:inline-flex;overflow:hidden;max-width:9em;
  transition:max-width .38s var(--ease),opacity .18s}
/* extends the shared rule above: same clip timing, plus the gap that closes with it */
.gulp_btn{transition:clip-path .44s cubic-bezier(.25,1,.5,1), gap .38s var(--ease)}
.gulp[data-state="turn"] .gulp_word,
.gulp[data-state="done"] .gulp_word{max-width:0;opacity:0}
.gulp[data-state="turn"] .gulp_btn,
.gulp[data-state="done"] .gulp_btn{gap:0}
/* the confirmation rides the reopened pill, so it must not be clipped with it */
.gulp_done{white-space:nowrap}
.gulp_word i{display:inline-block;font-style:normal;will-change:transform,opacity}
.gulp[data-state="chew"] .gulp_word i{
  animation:gulp-fly .5s cubic-bezier(.5,-.2,.7,.6) forwards;
  animation-delay:calc(var(--i) * 62ms);
}
@keyframes gulp-fly{
  0%  {transform:translate(0,0) rotate(0deg) scale(1);opacity:1}
  55% {transform:translate(calc(var(--dx) * .55), calc(var(--dy) * .55 - 13px))
        rotate(calc(var(--dr) * .5)) scale(.72);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(.2);opacity:0}
}

/* the ring only exists while it is turning */
.gulp_ring{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.gulp_ring circle{
  fill:none;stroke:#2a0810;stroke-width:8;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:72;
}
.gulp[data-state="turn"] .gulp_ring{opacity:1;animation:spin .78s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* the closing word */
.gulp_done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:700;color:#08281f;opacity:0;pointer-events:none;transition:opacity .24s .1s}
.gulp_done svg{width:18px;height:18px;fill:none;stroke:#08281f;stroke-width:3.2;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26}
.gulp[data-state="done"] .gulp_done{opacity:1}
.gulp[data-state="done"] .gulp_done svg{transition:stroke-dashoffset .4s ease .18s;stroke-dashoffset:0}
.gulp[data-state="done"] .gulp_face{background:linear-gradient(118deg,var(--ok),#4bc7ff)}
.gulp[data-state="done"] .gulp_btn{opacity:0}

.readout{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);z-index:1}
.readout b{color:var(--bad)}

@media (prefers-reduced-motion:reduce){
  .gulp_face,.gulp_btn,.gulp_fill,.gulp_lid{transition-duration:.01ms}
}
</style>
</head>
<body>

<div class="head">
  <p>COMPONENT</p>
  <h1>Gulp</h1>
  <p>The word goes in. The level comes up.</p>
</div>

<span class="gulp" id="gulp" data-state="idle">
  <span class="gulp_body">
    <!-- Component face: maintain either pill or disc geometry -->
    <span class="gulp_face"></span>

    <button class="gulp_btn" id="btn" type="button">
      <svg class="gulp_icon" viewBox="0 0 100 100" aria-hidden="true">
        <g class="gulp_can">
          <clipPath id="gulp_clip" class="gulp_clip">
            <path d="M33 40 H67 L62.5 84 H37.5 Z"/>
          </clipPath>
          <g class="gulp_liq" clip-path="url(#gulp_clip)">
            <!-- parked up-left; the 46:29 slide walks it into the can -->
            <path class="gulp_fill" d="M-72 -46 H22 Q25 -18 21 4 Q17 28 23 58 L-72 58 Z"/>
          </g>
          <path class="gulp_bin" d="M29 35 H71 L66.5 86 A5 5 0 0 1 61.5 91 H38.5 A5 5 0 0 1 33.5 86 Z"/>
          <path class="gulp_rib" d="M44 48 V78 M56 48 V78"/>
          <g class="gulp_lid">
            <path d="M19 27 H81 M41 15 H59"/>
          </g>
        </g>
      </svg>
      <span data-label class="gulp_word" id="word">Delete</span>
    </button>

    <svg class="gulp_ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16"/></svg>

    <span class="gulp_done" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></svg>Deleted
    </span>
  </span>
</span>

<p class="readout" id="readout">state <b>idle</b></p>

<script>
const root = document.getElementById('gulp');
const btn  = document.getElementById('btn');
const word = document.getElementById('word');
const fill = root.querySelector('.gulp_fill');
const readout = document.getElementById('readout');

const LABEL = 'Delete';
const MIN_TURN = 900;                       // the ring never flashes
const wait = ms => new Promise(r => setTimeout(r, ms));
const atLeast = (ms, p) => Promise.all([p, wait(ms)]).then(([v]) => v);

let chars = [], landed = 0, busy = false;

function setState(s){
  root.dataset.state = s;
  readout.innerHTML = 'state <b>' + s + '</b>';
}

/* split the label so each character can be thrown separately */
function split(){
  word.innerHTML = [...LABEL].map((c, i) =>
    `<i style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</i>`).join('');
  chars = [...word.querySelectorAll('i')];
}

/* each character needs its own vector to the mouth of the can */
function aimChars(){
  const can = root.querySelector('.gulp_icon').getBoundingClientRect();
  const mx = can.left + can.width / 2, my = can.top + can.height * .38;
  chars.forEach(c => {
    const r = c.getBoundingClientRect();
    c.style.setProperty('--dx', (mx - (r.left + r.width / 2)).toFixed(1) + 'px');
    c.style.setProperty('--dy', (my - (r.top + r.height / 2)).toFixed(1) + 'px');
    c.style.setProperty('--dr', (Math.random() * 60 - 30).toFixed(1) + 'deg');
  });
}

function slosh(){
  fill.classList.remove('slosh');
  void fill.offsetWidth;
  fill.classList.add('slosh');
}

/* --p is a promise: it resolves when the level has finished moving */
const setP = v => new Promise(res => {
  let done = false;
  const fin = () => { if (!done){ done = true; res(v); } };
  fill.addEventListener('transitionend', fin, { once:true });
  root.style.setProperty('--p', v);
  setTimeout(fin, 700);                     // never hang on a no-op transition
});

/* Animation state management */
root.addEventListener('animationend', (e) => {
  if (e.animationName !== 'gulp-fly') return;
  landed += 1;
  root.style.setProperty('--p', landed / chars.length);
  slosh();
  if (landed === chars.length) turn();
});

async function turn(){
  setState('turn');
  root.style.setProperty('--fx', '52px');   // now the word is gone, fold to a disc
  // the real request would go here; atLeast holds the ring for a legible beat
  const res = await atLeast(MIN_TURN, setP(0));
  root.style.setProperty('--fx', '0px');    // unfold: "Deleted" needs the whole pill
  setState('done');
  await wait(1900);
  reset();
}

function reset(){
  landed = 0;
  root.style.setProperty('--p', 0);
  root.style.setProperty('--fx', '0px');    // disc opens back out to the pill
  split();
  setState('idle');
  busy = false;
}

btn.addEventListener('click', () => {
  if (busy) return;
  busy = true;
  landed = 0;
  root.style.setProperty('--p', 0);
  aimChars();
  setState('chew');                         // stays a full pill: the letters are still in it
});

addEventListener('resize', () => { if (root.dataset.state === 'idle') aimChars(); });

split();
setP(0);
requestAnimationFrame(aimChars);
</script>
</body>
</html>
