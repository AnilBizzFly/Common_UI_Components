<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme toggle</title>
<style>
:root{
  --ground:#f3f1ea; --card:#ffffff; --line:rgba(18,22,30,.1);
  --txt:#141a24; --mut:#4d5663; --dim:#78818e; --faint:#a6adb8;
  --orb:#f6a935; --halo:rgba(246,169,53,.34);
  --ease:cubic-bezier(.25,1,.5,1);
}
[data-theme="dark"]{
  --ground:#080c17; --card:#141b2b; --line:rgba(255,255,255,.08);
  --txt:#e9edf8; --mut:#8b95b3; --dim:#5a6482; --faint:#3c4562;
  --orb:#dfe6f5; --halo:rgba(223,230,245,.22);
}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:26px;padding:30px 20px;font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color:var(--txt);background:var(--ground);
transition:background .55s var(--ease),color .55s var(--ease)}

.head{text-align:center;z-index:1}
.head p:first-child{margin:0 0 7px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--faint)}
.head h1{margin:0 0 5px;font-size:21px;letter-spacing:-.03em}
.head p:last-child{margin:0;font-size:13px;color:var(--dim)}

.panel{display:flex;align-items:center;gap:16px;width:min(340px,100%);padding:16px;
border-radius:20px;background:var(--card);border:1px solid var(--line);
box-shadow:0 24px 56px -26px rgba(10,14,22,.34);
transition:background .55s var(--ease),border-color .55s var(--ease)}
.panel .t{flex:1;min-width:0}
.panel b{display:block;font-size:14px;font-weight:600}
.panel span{font-size:12px;color:var(--dim)}

/* ---------- the button ---------- */
.theme{position:relative;width:60px;height:34px;flex:0 0 auto;padding:0;cursor:pointer;
border:1px solid var(--line);border-radius:99px;background:rgba(128,140,160,.14);
transition:background .45s var(--ease),border-color .45s}
.theme:focus-visible{outline:2px solid var(--orb);outline-offset:3px}
[data-theme="dark"] .theme{background:rgba(124,150,220,.18)}

.knob{position:absolute;top:3px;left:3px;width:26px;height:26px;
transition:transform .55s cubic-bezier(.5,1.4,.5,1)}
[data-theme="dark"] .knob{transform:translateX(26px)}

/* the crescent is one inset shadow — slide it off and the moon becomes a sun */
.orb{position:absolute;inset:0;border-radius:50%;background:var(--orb);
box-shadow:inset 13px -13px 0 0 var(--card), 0 0 14px 2px var(--halo);
transition:box-shadow .55s var(--ease),background .55s var(--ease)}
[data-theme="dark"] .orb{box-shadow:inset -7px -5px 0 0 var(--card), 0 0 14px 2px var(--halo)}

/* eight rays, out in the light, gone in the dark */
.ray{position:absolute;left:50%;top:50%;width:2.4px;height:5px;margin:-2.5px 0 0 -1.2px;
border-radius:2px;background:var(--orb);
transform:rotate(var(--r)) translateY(-14px);
transition:transform .55s var(--ease),opacity .4s var(--ease)}
[data-theme="dark"] .ray{opacity:0;transform:rotate(var(--r)) translateY(-6px) scale(.4)}

/* the switch paints the whole page, so say so */
.wash{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;
background:radial-gradient(circle at var(--wx) var(--wy),var(--halo),transparent 42%)}
.wash.go{animation:wash .7s ease-out}
@keyframes wash{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}

.readout{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;
text-transform:uppercase;color:var(--faint);z-index:1}
.readout b{color:var(--orb)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.wash{display:none}}
</style>
</head>
<body>

<span class="wash" id="wash"></span>

<div class="head">
  <p>BUTTON 09</p><h1>Theme</h1>
  <p>The crescent is a single inset shadow &mdash; slide it and the moon is a sun.</p>
</div>

<div class="panel">
  <span class="t"><b>Appearance</b><span id="sub">Light &mdash; follows nothing, you chose it</span></span>
  <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
    <span class="knob">
      <span class="ray" style="--r:0deg"></span><span class="ray" style="--r:45deg"></span>
      <span class="ray" style="--r:90deg"></span><span class="ray" style="--r:135deg"></span>
      <span class="ray" style="--r:180deg"></span><span class="ray" style="--r:225deg"></span>
      <span class="ray" style="--r:270deg"></span><span class="ray" style="--r:315deg"></span>
      <span class="orb"></span>
    </span>
  </button>
</div>

<p class="readout" id="readout">theme <b>light</b></p>

<script>
const theme = document.getElementById('theme'), wash = document.getElementById('wash'),
      readout = document.getElementById('readout'), sub = document.getElementById('sub');
let dark = false;

theme.addEventListener('click', () => {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  theme.setAttribute('aria-checked', String(dark));
  readout.innerHTML = 'theme <b>' + (dark ? 'dark' : 'light') + '</b>';
  sub.innerHTML = (dark ? 'Dark' : 'Light') + ' &mdash; follows nothing, you chose it';

  /* the wash starts at the switch, so the change reads as coming FROM the button */
  const r = theme.getBoundingClientRect();
  wash.style.setProperty('--wx', (r.left + r.width / 2) + 'px');
  wash.style.setProperty('--wy', (r.top + r.height / 2) + 'px');
  wash.classList.remove('go'); void wash.offsetWidth; wash.classList.add('go');
});

document.documentElement.setAttribute('data-theme', 'light');
</script>
</body>
</html>
