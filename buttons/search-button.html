<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search expand</title>
<style>
:root{--bg:#080c17;--card:#141b2b;--line:rgba(255,255,255,.08);
--txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;
--a:#7cc4ff;--b:#a98bff;--ease:cubic-bezier(.25,1,.5,1)}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:26px;padding:30px 20px;font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color:var(--txt);background:var(--bg)}
body::before{content:"";position:fixed;width:58vmax;height:58vmax;border-radius:50%;filter:blur(150px);
background:rgba(124,196,255,.11);top:-24vmax;left:50%;margin-left:-29vmax;pointer-events:none}

.head{text-align:center;z-index:1}
.head p:first-child{margin:0 0 7px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--faint)}
.head h1{margin:0 0 5px;font-size:21px;letter-spacing:-.03em}
.head p:last-child{margin:0;font-size:13px;color:var(--dim)}

/* a fake toolbar, so the expansion has something to push against */
.toolbar{position:relative;z-index:1;display:flex;align-items:center;gap:8px;width:min(400px,100%);
padding:9px;border-radius:19px;background:linear-gradient(168deg,var(--card),#0e1422);
border:1px solid var(--line);box-shadow:0 30px 66px -28px rgba(0,0,0,.86)}
.tool{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border-radius:12px;
background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--dim);cursor:pointer;
transition:opacity .3s var(--ease),transform .3s var(--ease),color .2s}
.tool:hover{color:var(--mut)}
.tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}

/* ---------- the button ---------- */
/* it is one element the whole time — a disc that becomes a field */
.search{position:absolute;right:9px;top:9px;display:flex;align-items:center;height:38px;width:38px;
border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);
cursor:pointer;overflow:hidden;z-index:2;
transition:width .42s var(--ease),background .3s,border-color .3s,box-shadow .3s}
.search .mag{position:absolute;left:10px;width:17px;height:17px;fill:none;stroke:var(--mut);
stroke-width:2;stroke-linecap:round;pointer-events:none;transition:stroke .25s}
.search input{width:100%;height:100%;padding:0 34px 0 34px;font:inherit;font-size:13.5px;color:var(--txt);
background:none;border:0;outline:none;opacity:0;pointer-events:none;transition:opacity .22s}
.search input::placeholder{color:var(--faint)}
.search .esc{position:absolute;right:8px;width:22px;height:22px;display:grid;place-items:center;
border:0;border-radius:7px;background:rgba(255,255,255,.08);color:var(--dim);cursor:pointer;
opacity:0;pointer-events:none;transition:opacity .2s;font:600 9px/1 ui-monospace,Menlo,monospace}

.toolbar.open .search{width:calc(100% - 18px);background:rgba(124,196,255,.09);border-color:var(--a);
box-shadow:0 0 0 3px rgba(124,196,255,.13)}
.toolbar.open .search .mag{stroke:var(--a)}
.toolbar.open .search input{opacity:1;pointer-events:auto}
.toolbar.open .search .esc{opacity:1;pointer-events:auto}
/* the other tools stand aside rather than being deleted */
.toolbar.open .tool{opacity:0;transform:scale(.7);pointer-events:none}

/* ---------- results ---------- */
.res{position:relative;z-index:1;width:min(400px,100%);display:flex;flex-direction:column;gap:6px;
max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.toolbar.open ~ .res{max-height:230px}
.hit{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;
background:rgba(255,255,255,.03);border:1px solid var(--line);
opacity:0;transform:translateY(-6px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toolbar.open ~ .res .hit{opacity:1;transform:none}
.toolbar.open ~ .res .hit:nth-child(1){transition-delay:.1s}
.toolbar.open ~ .res .hit:nth-child(2){transition-delay:.16s}
.toolbar.open ~ .res .hit:nth-child(3){transition-delay:.22s}
.hit i{width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
background:rgba(124,196,255,.14);color:var(--a);font:700 11px/1 ui-monospace,Menlo,monospace;font-style:normal}
.hit b{flex:1;font-size:13px;font-weight:550}
.hit span{font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--faint)}

.readout{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;
text-transform:uppercase;color:var(--faint);z-index:1}
.readout b{color:var(--a)}
@media (prefers-reduced-motion:reduce){.search,.tool,.hit,.res{transition-duration:.01ms}}
</style>
</head>
<body>

<div class="head">
  <p>BUTTON 08</p><h1>Search</h1>
  <p>One element throughout &mdash; the disc widens into the field.</p>
</div>

<div class="toolbar" id="toolbar">
  <button class="tool" type="button" aria-label="New"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tool" type="button" aria-label="Filter"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></svg></button>
  <button class="tool" type="button" aria-label="Sort"><svg viewBox="0 0 24 24"><path d="M4 7h16M6 12h12M9 17h6"/></svg></button>
  <span class="spacer"></span>
  <div class="search" id="search">
    <svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search projects, people, docs…" aria-label="Search">
    <button class="esc" id="esc" type="button" aria-label="Close search">esc</button>
  </div>
</div>

<div class="res" id="res">
  <div class="hit"><i>PR</i><b>Parallel index rebuild</b><span>PR 412</span></div>
  <div class="hit"><i>DC</i><b>Webhook retry policy</b><span>DOCS</span></div>
  <div class="hit"><i>PJ</i><b>checkout-api</b><span>PROJECT</span></div>
</div>

<p class="readout" id="readout">field <b>collapsed</b></p>

<script>
const toolbar = document.getElementById('toolbar'), search = document.getElementById('search'),
      q = document.getElementById('q'), esc = document.getElementById('esc'),
      readout = document.getElementById('readout');

function open(){
  if (toolbar.classList.contains('open')) return;
  toolbar.classList.add('open');
  readout.innerHTML = 'field <b>expanded</b>';
  setTimeout(() => q.focus(), 180);              // after the width has begun, so no scroll jump
}
function close(){
  toolbar.classList.remove('open');
  q.value = ''; q.blur();
  readout.innerHTML = 'field <b>collapsed</b>';
}

search.addEventListener('click', e => { if (e.target !== esc) open(); });
esc.addEventListener('click', e => { e.stopPropagation(); close(); });
q.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
document.addEventListener('pointerdown', e => {
  if (toolbar.classList.contains('open') && !toolbar.contains(e.target)) close();
});
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); open(); }
});
</script>
</body>
</html>
