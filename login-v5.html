<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login V5</title>
<style>
/* Tailwind values from the source, resolved once so the rest reads in roles */
:root{
  --black:#000000;
  --zinc-950:#09090b; --zinc-900:#18181b; --zinc-800:#27272a; --zinc-700:#3f3f46;
  --zinc-600:#52525b; --zinc-500:#71717a; --zinc-400:#a1a1aa; --zinc-300:#d4d4d8;
  --white:#ffffff;
  --emerald:#34d399; --rose:#fb7185;
  --r-2xl:1rem;          /* rounded-2xl */
  --r-xl:.75rem;         /* rounded-xl  */
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.45,.5,1);
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;                       /* min-h-screen */
  display:flex;align-items:center;justify-content:center;   /* flex items-center justify-center */
  padding:24px;background:var(--black);           /* bg-black */
  font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--white);
}
/* the card is translucent and blurred, so it needs something to blur */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(42vmax 34vmax at 22% 12%,rgba(99,102,241,.16),transparent 62%),
    radial-gradient(38vmax 34vmax at 80% 84%,rgba(244,63,94,.12),transparent 62%),
    radial-gradient(34vmax 30vmax at 68% 18%,rgba(34,211,238,.1),transparent 62%);
  animation:drift 26s ease-in-out infinite;
}
@keyframes drift{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.12) translate(-2vmax,2vmax)}}
body::after{
  content:"";position:fixed;inset:-50%;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='150' height='150'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='150' height='150' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ============ the card — w-full max-w-md p-8 rounded-2xl
                border border-zinc-800 bg-zinc-900/70 backdrop-blur-xl ============ */
.card{
  position:relative;z-index:1;width:100%;max-width:28rem;padding:2rem;
  border-radius:var(--r-2xl);
  border:1px solid var(--zinc-800);
  background:rgb(24 24 27 / .7);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 1px 0 rgb(255 255 255 / .05) inset, 0 40px 90px -30px rgb(0 0 0 / .9);
  opacity:0;transform:translateY(18px) scale(.985);
  animation:rise .7s var(--ease) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}

/* a soft light that follows the pointer across the panel */
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgb(255 255 255 / .06),transparent 60%);
  opacity:0;transition:opacity .45s ease;
}
.card:hover::before{opacity:1}

/* every child arrives a beat after the one above it */
.stag{opacity:0;transform:translateY(12px);animation:up .6s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.10s}.d2{animation-delay:.17s}.d3{animation-delay:.24s}
.d4{animation-delay:.31s}.d5{animation-delay:.38s}.d6{animation-delay:.45s}.d7{animation-delay:.52s}

h1{margin:0 0 .5rem;font-size:1.875rem;line-height:2.25rem;font-weight:700;
   text-align:center;letter-spacing:-.03em}
.sub{margin:0 0 1.5rem;text-align:center;color:var(--zinc-400);font-size:.95rem}

/* ============ form — space-y-5 ============ */
form{display:flex;flex-direction:column;gap:1.25rem}

.field{position:relative}
.field input{
  width:100%;height:56px;padding:22px 14px 8px;
  font:inherit;font-size:.95rem;color:var(--white);
  background:rgb(9 9 11 / .6);
  border:1px solid var(--zinc-800);border-radius:var(--r-xl);outline:none;
  transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;
}
.field input::placeholder{color:transparent}
.field input:hover{border-color:var(--zinc-700)}
.field input:focus{
  border-color:var(--zinc-600);background:rgb(9 9 11 / .85);
  box-shadow:0 0 0 4px rgb(255 255 255 / .05);
}
/* the label lifts and shrinks into the top of the box */
.field label{
  position:absolute;left:15px;top:17px;pointer-events:none;
  font-size:.95rem;color:var(--zinc-500);
  transform-origin:left top;
  transition:transform .28s var(--spring),color .25s ease;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label{
  transform:translateY(-10px) scale(.74);color:var(--zinc-400);
}
.field input:focus + label{color:var(--zinc-300)}

/* a line of light that runs the width of the field the moment it takes focus */
.field .beam{position:absolute;left:14px;right:14px;bottom:1px;height:1px;overflow:hidden;
  pointer-events:none;border-radius:1px}
.field .beam i{position:absolute;inset:0;transform:scaleX(0);transform-origin:left;
  background:linear-gradient(90deg,transparent,var(--white),transparent);
  transition:transform .55s var(--ease)}
.field:focus-within .beam i{transform:scaleX(1)}

.field.bad input{border-color:var(--rose);box-shadow:0 0 0 4px rgb(251 113 133 / .12)}
.field.bad label{color:var(--rose)}
.note{margin:6px 0 0;font-size:.75rem;color:var(--rose);
  display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .26s var(--ease),opacity .2s,margin .26s}
.note>span{overflow:hidden}
.field.bad .note{grid-template-rows:1fr;opacity:1}

/* the Eye / EyeOff pair from the source */
.reveal{
  position:absolute;right:8px;top:50%;margin-top:-18px;width:36px;height:36px;
  display:grid;place-items:center;border:0;border-radius:10px;
  background:transparent;color:var(--zinc-500);cursor:pointer;
  transition:color .2s,background .2s;
}
.reveal:hover{color:var(--zinc-300);background:rgb(255 255 255 / .06)}
.reveal svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.reveal .off{display:none}
.reveal.on{color:var(--white)}
.reveal.on .off{display:block}
.reveal.on .eye{display:none}

.caps{position:absolute;right:52px;top:50%;margin-top:-9px;
  font:600 9px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.12em;
  padding:1px 6px;border-radius:5px;color:#fde68a;background:rgb(253 230 138 / .12);
  border:1px solid rgb(253 230 138 / .3);
  opacity:0;transform:scale(.85);transition:opacity .2s,transform .28s var(--spring);pointer-events:none}
.caps.on{opacity:1;transform:none}

/* ---------- the row ---------- */
.row{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;margin-top:-.25rem}
.check{display:flex;align-items:center;gap:.55rem;color:var(--zinc-400);cursor:pointer;user-select:none}
.check input{position:absolute;opacity:0;width:0;height:0}
.box{width:18px;height:18px;border-radius:6px;border:1px solid var(--zinc-700);
  background:rgb(9 9 11 / .6);display:grid;place-items:center;
  transition:background .25s ease,border-color .25s ease}
.box svg{width:11px;height:11px;fill:none;stroke:var(--black);stroke-width:3.4;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s var(--ease) .05s}
.check input:checked + .box{background:var(--white);border-color:var(--white)}
.check input:checked + .box svg{stroke-dashoffset:0}
.check input:focus-visible + .box{box-shadow:0 0 0 4px rgb(255 255 255 / .12)}
.link{color:var(--zinc-400);text-decoration:none;position:relative;transition:color .22s}
.link:hover{color:var(--white)}
.link::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:right;transition:transform .32s var(--ease)}
.link:hover::after{transform:scaleX(1);transform-origin:left}

/* ---------- the button ---------- */
.submit{
  position:relative;width:100%;height:52px;overflow:hidden;
  font:inherit;font-size:.95rem;font-weight:600;color:var(--black);
  background:var(--white);border:0;border-radius:var(--r-xl);cursor:pointer;
  box-shadow:0 10px 30px -12px rgb(255 255 255 / .35);
  transition:transform .18s var(--spring),box-shadow .3s ease,background .4s ease,color .4s ease;
}
.submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 40px -12px rgb(255 255 255 / .5)}
.submit:active:not(:disabled){transform:translateY(0) scale(.99)}
.submit:disabled{cursor:default}
.submit:focus-visible{outline:2px solid var(--white);outline-offset:3px}
/* a highlight crosses it on hover */
.submit .shine{position:absolute;top:0;bottom:0;width:36%;left:-45%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgb(0 0 0 / .1),transparent)}
.submit:hover:not(:disabled) .shine{animation:shine .9s var(--ease)}
@keyframes shine{to{left:115%}}

.submit span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.5rem;
  transition:opacity .22s ease,transform .34s var(--spring)}
.submit .idle{opacity:1}
.submit .busy{opacity:0;transform:scale(.9)}
.submit .done{opacity:0;transform:scale(.9)}
.submit .busy svg{width:19px;height:19px;animation:spin .7s linear infinite}
.submit .busy circle{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;
  stroke-dasharray:34 22;opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
.submit .done svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26}

.submit[data-state="loading"] .idle{opacity:0;transform:scale(.9)}
.submit[data-state="loading"] .busy{opacity:1;transform:none}
.submit[data-state="done"]{background:var(--emerald);color:#022c22;
  box-shadow:0 14px 40px -12px rgb(52 211 153 / .6)}
.submit[data-state="done"] .idle{opacity:0;transform:scale(.9)}
.submit[data-state="done"] .done{opacity:1;transform:none}
.submit[data-state="done"] .done svg{transition:stroke-dashoffset .42s var(--ease) .08s;stroke-dashoffset:0}

/* ---------- foot ---------- */
.foot{margin:1.5rem 0 0;text-align:center;font-size:.85rem;color:var(--zinc-500)}
.foot a{color:var(--white);font-weight:500;text-decoration:none;position:relative}
.foot a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:right;transition:transform .32s var(--ease)}
.foot a:hover::after{transform:scaleX(1);transform-origin:left}

.card.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="card" id="card">
  <h1 class="stag d1">Welcome Back</h1>
  <p class="sub stag d2">Login to your account</p>

  <form id="form" novalidate autocomplete="off">
    <!-- Form fields and button go here -->
    <div class="field stag d3" id="f-email">
      <input id="email" type="email" placeholder=" " autocomplete="username">
      <label for="email">Email</label>
      <span class="beam"><i></i></span>
      <p class="note"><span>Enter a valid email address</span></p>
    </div>

    <div class="field stag d4" id="f-pass">
      <input id="password" type="password" placeholder=" " autocomplete="current-password">
      <label for="password">Password</label>
      <span class="beam"><i></i></span>
      <span class="caps" id="caps">CAPS</span>
      <button class="reveal" id="reveal" type="button" aria-label="Show password">
        <svg class="eye" viewBox="0 0 24 24"><path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.3 0 10 6 10 6a17 17 0 0 1-3 3.6M6.6 6.9A17 17 0 0 0 2 12s3.7 6 10 6a9.7 9.7 0 0 0 4.2-.9"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
      <p class="note"><span>Password must be at least 6 characters</span></p>
    </div>

    <div class="row stag d5">
      <label class="check">
        <input type="checkbox" checked>
        <span class="box"><svg viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></svg></span>
        Remember me
      </label>
      <a class="link" href="#" onclick="return false">Forgot password?</a>
    </div>

    <button class="submit stag d6" id="submit" type="submit" data-state="idle">
      <span class="shine"></span>
      <span class="idle">Sign in</span>
      <span class="busy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>Signing in</span>
      <span class="done"><svg viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></svg>Welcome back</span>
    </button>
  </form>

  <p class="foot stag d7">Don&rsquo;t have an account? <a href="#" onclick="return false">Sign up</a></p>
</div>

<script>
const $ = s => document.querySelector(s);
const card = $('#card'), form = $('#form'), submit = $('#submit'),
      email = $('#email'), password = $('#password'),
      reveal = $('#reveal'), caps = $('#caps');

/* ---- state, matching the source component ---- */
let showPassword = false;
let loading = false;

/* the panel catches the light wherever the pointer is */
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const r = card.getBoundingClientRect();
  card.style.setProperty('--mx', (((e.clientX - r.left) / r.width) * 100).toFixed(1) + '%');
  card.style.setProperty('--my', (((e.clientY - r.top) / r.height) * 100).toFixed(1) + '%');
});

/* ---- Eye / EyeOff ---- */
reveal.addEventListener('mousedown', e => e.preventDefault());
reveal.addEventListener('click', () => {
  showPassword = !showPassword;
  password.type = showPassword ? 'text' : 'password';
  reveal.classList.toggle('on', showPassword);
  reveal.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
  password.focus();
});

/* caps lock is the single most useful thing a password field can tell you */
const capsCheck = e => {
  if (typeof e.getModifierState !== 'function') return;
  caps.classList.toggle('on', e.getModifierState('CapsLock'));
};
password.addEventListener('keydown', capsCheck);
password.addEventListener('keyup', capsCheck);
password.addEventListener('blur', () => caps.classList.remove('on'));

[email, password].forEach(i =>
  i.addEventListener('input', () => i.closest('.field').classList.remove('bad')));

/* ---- handleSubmit: setLoading(true), then false after 1500ms ---- */
form.addEventListener('submit', e => {
  e.preventDefault();
  if (loading) return;

  const okMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  const okPass = password.value.length >= 6;
  $('#f-email').classList.toggle('bad', !okMail);
  $('#f-pass').classList.toggle('bad', !okPass);
  if (!okMail || !okPass){
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    (okMail ? password : email).focus();
    return;
  }

  loading = true;
  submit.dataset.state = 'loading';
  submit.disabled = true;

  // login logic here
  setTimeout(() => {
    loading = false;
    /* ADDED: the source returns straight to idle, which reads as nothing having
       happened. A held confirmation, then a reset. */
    submit.dataset.state = 'done';
    setTimeout(() => {
      submit.dataset.state = 'idle';
      submit.disabled = false;
    }, 1700);
  }, 1500);
});
</script>
</body>
</html>
