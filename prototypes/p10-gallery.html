<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery & Lightbox</title>
<style>
:root{--bg:#080c17;--card:#141b2b;--line:rgba(255,255,255,.08);
--txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;--a:#7cc4ff;--b:#a98bff}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:26px 20px;
font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}

.wrap{width:min(780px,100%)}
.hd{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.hd h1{margin:0;flex:1;font-size:20px;letter-spacing:-.025em}
.hd p{margin:0;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;
text-transform:uppercase;color:var(--faint)}

.masonry{columns:3;column-gap:12px}
@media(max-width:640px){.masonry{columns:2}}
@media(max-width:400px){.masonry{columns:1}}

.cell{break-inside:avoid;margin:0 0 12px;position:relative;border-radius:16px;overflow:hidden;
cursor:zoom-in;border:1px solid var(--line);background:var(--card);
transition:transform .32s cubic-bezier(.3,1.1,.4,1),box-shadow .32s,border-color .32s}
.cell:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.2);
box-shadow:0 22px 44px -18px rgba(0,0,0,.9)}
.cell:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.cell .art{display:block;width:100%}
.cell figcaption{position:absolute;inset:auto 0 0 0;padding:26px 12px 11px;
background:linear-gradient(180deg,transparent,rgba(4,7,14,.9));
opacity:0;transform:translateY(6px);transition:opacity .28s,transform .28s}
.cell:hover figcaption,.cell:focus-visible figcaption{opacity:1;transform:none}
.cell figcaption b{display:block;font-size:12.5px;font-weight:600}
.cell figcaption span{font:600 9.5px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.1em;
text-transform:uppercase;color:var(--faint)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:5vh 5vw;
background:rgba(4,7,14,.9);backdrop-filter:blur(10px);
opacity:0;visibility:hidden;transition:opacity .26s,visibility .26s}
.lb.on{opacity:1;visibility:visible}
.lb_fig{max-width:min(760px,100%);transform:scale(.94);transition:transform .3s cubic-bezier(.3,1.2,.4,1)}
.lb.on .lb_fig{transform:none}
.lb_art{display:block;width:100%;max-height:74vh;border-radius:18px;
box-shadow:0 40px 90px -26px rgba(0,0,0,.95)}
.lb_cap{display:flex;align-items:baseline;gap:12px;margin-top:14px}
.lb_cap b{flex:1;font-size:15px;font-weight:600;letter-spacing:-.01em}
.lb_cap span{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;
text-transform:uppercase;color:var(--faint)}
.nav{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;display:grid;place-items:center;
border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
color:var(--txt);cursor:pointer;transition:.2s;backdrop-filter:blur(6px)}
.nav:hover{background:rgba(255,255,255,.18)}
.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prev{left:3vw}.next{right:3vw}
.close{position:absolute;top:22px;right:22px;width:38px;height:38px;margin:0}
.count{position:absolute;top:26px;left:26px;font:600 11px/1 ui-monospace,Menlo,monospace;
letter-spacing:.12em;color:var(--faint);font-variant-numeric:tabular-nums}
.kb{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:14px;
font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.kb i{font-style:normal;padding:2px 6px;border:1px solid var(--line);border-radius:4px;
background:rgba(255,255,255,.05);margin-right:4px}
@media(max-width:640px){.prev{left:8px}.next{right:8px}.kb{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="hd"><h1>Field studies</h1><p>click a tile &middot; ← → to browse</p></div>
  <div class="masonry" id="grid"></div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <span class="count" id="count"></span>
  <button class="nav close" type="button" id="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <button class="nav prev" type="button" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="nav next" type="button" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  <figure class="lb_fig" id="fig">
    <div class="lb_art" id="lbArt"></div>
    <figcaption class="lb_cap"><b id="lbT"></b><span id="lbM"></span></figcaption>
  </figure>
  <div class="kb"><span><i>←</i><i>→</i>browse</span><span><i>esc</i>close</span></div>
</div>

<script>
/* every tile is generated — no assets, no network */
const ART = [
  { t:'Dune ridge, 04:40',   m:'Nevada',   h:1.30, c:['#ff9d4d','#e0455f','#3b2a66'] },
  { t:'Cold harbour',        m:'Bergen',   h:0.78, c:['#7cc4ff','#3f6bd6','#101a33'] },
  { t:'Salt flat, noon',     m:'Uyuni',    h:1.00, c:['#f3f0e4','#9fc6d8','#4a6f88'] },
  { t:'Understorey',         m:'Kerala',   h:1.24, c:['#a9e08a','#2f9b6a','#0e3b34'] },
  { t:'Signal fire',         m:'Reykjavík',h:0.72, c:['#ffd27a','#ff7a59','#3a1d4a'] },
  { t:'Terrace, late light',  m:'Lisbon',   h:1.14, c:['#ffc3a0','#d98074','#4a2b47'] },
  { t:'Pack ice',            m:'Svalbard', h:0.86, c:['#dff3ff','#7fb6d9','#274a68'] },
  { t:'Night market',        m:'Taipei',   h:1.32, c:['#ff8ac4','#a55cff','#1b1436'] },
  { t:'Lava field',          m:'Hawai‘i',  h:0.9,  c:['#ffb057','#c9422e','#241018'] }
];
const svg = (a, w, h, seed) => {
  const [c1, c2, c3] = a.c;
  return `<svg class="art" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${seed}" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/>
    </linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#g${seed})"/>
    <circle cx="${w * .72}" cy="${h * .26}" r="${h * .17}" fill="#fff" opacity=".22"/>
    <path d="M0 ${h * .74} Q ${w * .27} ${h * .58} ${w * .5} ${h * .7} T ${w} ${h * .64} L${w} ${h} L0 ${h} Z" fill="#000" opacity=".26"/>
    <path d="M0 ${h * .87} Q ${w * .33} ${h * .77} ${w * .62} ${h * .86} T ${w} ${h * .82} L${w} ${h} L0 ${h} Z" fill="#000" opacity=".34"/>
  </svg>`;
};

const grid = document.getElementById('grid');
grid.innerHTML = ART.map((a, i) =>
  `<figure class="cell" tabindex="0" role="button" data-i="${i}" aria-label="Open ${a.t}">
     ${svg(a, 400, Math.round(400 * a.h), i)}
     <figcaption><b>${a.t}</b><span>${a.m}</span></figcaption>
   </figure>`).join('');

const lb = document.getElementById('lb'), lbArt = document.getElementById('lbArt');
let at = 0;

function open(i){
  at = (i + ART.length) % ART.length;
  const a = ART[at];
  lbArt.innerHTML = svg(a, 1200, Math.round(1200 * a.h * .62), 'L' + at);
  lbArt.firstElementChild.setAttribute('style', 'display:block;width:100%;height:auto;border-radius:18px');
  document.getElementById('lbT').textContent = a.t;
  document.getElementById('lbM').textContent = a.m;
  document.getElementById('count').textContent = (at + 1) + ' / ' + ART.length;
  lb.classList.add('on');
  document.getElementById('x').focus();
}
const close = () => lb.classList.remove('on');

grid.addEventListener('click', e => { const c = e.target.closest('.cell'); if (c) open(+c.dataset.i); });
grid.addEventListener('keydown', e => {
  const c = e.target.closest('.cell');
  if (c && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); open(+c.dataset.i); }
});
document.getElementById('x').addEventListener('click', close);
document.getElementById('prev').addEventListener('click', () => open(at - 1));
document.getElementById('next').addEventListener('click', () => open(at + 1));
lb.addEventListener('pointerdown', e => { if (e.target === lb) close(); });
addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowRight') open(at + 1);
  if (e.key === 'ArrowLeft') open(at - 1);
});
</script>
</body>
</html>
