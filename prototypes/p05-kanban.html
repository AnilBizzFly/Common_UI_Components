<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban Board</title>
<style>
:root{--bg:#080c17;--card:#141b2b;--card2:#0e1422;--line:rgba(255,255,255,.08);
--txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;--a:#7cc4ff;--b:#a98bff;--ok:#5fe0ac;--warn:#ffb057;--bad:#ff6b81}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:26px 20px;
font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);
background:var(--bg);-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;width:620px;height:620px;border-radius:50%;filter:blur(140px);
background:rgba(124,196,255,.1);top:-240px;left:-200px;pointer-events:none}

.board{position:relative;z-index:1;width:min(880px,100%)}
.board_hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.board_hd h1{margin:0;flex:1;font-size:19px;letter-spacing:-.02em}
.board_hd p{margin:0;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;
text-transform:uppercase;color:var(--faint)}

.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.col{padding:12px;border-radius:19px;background:linear-gradient(168deg,var(--card),var(--card2));
border:1px solid var(--line);box-shadow:0 26px 60px -30px rgba(0,0,0,.85);transition:border-color .2s,background .2s}
.col.over{border-color:rgba(124,196,255,.42);background:rgba(124,196,255,.05)}
.col_hd{display:flex;align-items:center;gap:8px;padding:2px 4px 11px}
.col_hd i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.col_hd b{flex:1;font-size:12.5px;font-weight:650;letter-spacing:-.01em}
.col_hd span{font:600 10.5px/1 ui-monospace,Menlo,monospace;color:var(--faint);
padding:3px 7px;border-radius:99px;background:rgba(255,255,255,.06)}
.stack{display:flex;flex-direction:column;gap:8px;min-height:56px}

.tk{padding:12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line);
cursor:grab;touch-action:none;transition:border-color .18s,background .18s,transform .18s}
.tk:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
.tk:active{cursor:grabbing}
.tk.ghosting{opacity:.32;filter:grayscale(.6)}
.tk.flying{position:fixed;z-index:60;width:var(--w);pointer-events:none;cursor:grabbing;
box-shadow:0 26px 50px -14px rgba(0,0,0,.9);border-color:rgba(124,196,255,.5);
background:#182036;transform:rotate(2.2deg) scale(1.03)}
.tk_top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.pri{padding:2px 7px;border-radius:99px;font:700 9px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.1em}
.p-hi{background:rgba(255,107,129,.15);color:var(--bad);border:1px solid rgba(255,107,129,.3)}
.p-md{background:rgba(255,176,87,.14);color:var(--warn);border:1px solid rgba(255,176,87,.28)}
.p-lo{background:rgba(95,224,172,.13);color:var(--ok);border:1px solid rgba(95,224,172,.28)}
.tk_top .id{margin-left:auto;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--faint)}
.tk h3{margin:0 0 9px;font-size:13px;font-weight:550;line-height:1.45;letter-spacing:-.005em}
.tk_ft{display:flex;align-items:center;gap:7px}
.who{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
font:700 9.5px/1 ui-sans-serif;color:#07121d}
.tags{margin-left:auto;display:flex;gap:5px}
.tag{padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.06);
font:600 9.5px/1.6 ui-monospace,Menlo,monospace;color:var(--dim)}

.slot{height:0;border-radius:12px;background:rgba(124,196,255,.1);
border:1.5px dashed rgba(124,196,255,.5);transition:height .18s cubic-bezier(.3,1.1,.4,1)}
.slot.on{height:64px}

.hint{margin:16px 0 0;text-align:center;font:600 10px/1 ui-monospace,Menlo,monospace;
letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="board">
  <div class="board_hd"><h1>Sprint 24</h1><p>drag a card between columns</p></div>
  <div class="cols" id="cols"></div>
  <p class="hint">pointer drag &middot; works on touch too</p>
</div>

<script>
const COLS = [
  { id:'todo', name:'To do',       tint:'#7cc4ff' },
  { id:'doing', name:'In progress', tint:'#ffb057' },
  { id:'done', name:'Done',        tint:'#5fe0ac' }
];
const AV = { PR:'#7cc4ff', MW:'#a98bff', SA:'#5fe0ac', JK:'#ffb057' };
let TASKS = [
  { id:'ATL-412', col:'todo',  pri:'hi', t:'Parallelise search index rebuild across shards', who:'MW', tags:['perf'] },
  { id:'ATL-418', col:'todo',  pri:'md', t:'Add inhibition windows to alert rules',          who:'SA', tags:['alerts'] },
  { id:'ATL-401', col:'todo',  pri:'lo', t:'Document the webhook retry policy',              who:'PR', tags:['docs'] },
  { id:'ATL-397', col:'doing', pri:'hi', t:'Fix rollback loop in checkout-api migrations',   who:'JK', tags:['bug','api'] },
  { id:'ATL-405', col:'doing', pri:'md', t:'Roving tabindex on the settings sidebar',        who:'PR', tags:['a11y'] },
  { id:'ATL-388', col:'done',  pri:'md', t:'Ship dark mode to all marketing pages',          who:'PR', tags:['ui'] },
  { id:'ATL-390', col:'done',  pri:'lo', t:'Bump Node to 22 in CI',                          who:'MW', tags:['ci'] }
];

const cols = document.getElementById('cols');
function render(){
  cols.innerHTML = COLS.map(c => {
    const mine = TASKS.filter(t => t.col === c.id);
    return `<section class="col" data-col="${c.id}">
      <div class="col_hd"><i style="background:${c.tint};box-shadow:0 0 8px ${c.tint}"></i>
        <b>${c.name}</b><span>${mine.length}</span></div>
      <div class="stack" data-stack="${c.id}">
        ${mine.map(card).join('')}
        <div class="slot"></div>
      </div>
    </section>`;
  }).join('');
}
const card = t => `<article class="tk" data-id="${t.id}">
  <div class="tk_top"><span class="pri p-${t.pri}">${t.pri.toUpperCase()}</span><span class="id">${t.id}</span></div>
  <h3>${t.t}</h3>
  <div class="tk_ft"><span class="who" style="background:${AV[t.who]}">${t.who}</span>
    <span class="tags">${t.tags.map(x => '<span class="tag">' + x + '</span>').join('')}</span></div>
</article>`;

/* ---------- pointer drag: works with mouse, pen and finger ---------- */
let drag = null;
cols.addEventListener('pointerdown', e => {
  const tk = e.target.closest('.tk');
  if (!tk || drag) return;
  const r = tk.getBoundingClientRect();
  drag = { id:tk.dataset.id, el:tk, dx:e.clientX - r.left, dy:e.clientY - r.top, w:r.width, fly:null, started:false, x:e.clientX, y:e.clientY };
  tk.setPointerCapture(e.pointerId);
});
addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;   // let a click stay a click
    drag.started = true;
    const fly = drag.el.cloneNode(true);
    fly.classList.add('flying');
    fly.style.setProperty('--w', drag.w + 'px');
    document.body.appendChild(fly);
    drag.fly = fly;
    drag.el.classList.add('ghosting');
  }
  drag.fly.style.left = (e.clientX - drag.dx) + 'px';
  drag.fly.style.top  = (e.clientY - drag.dy) + 'px';

  document.querySelectorAll('.col').forEach(c => c.classList.remove('over'));
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('on'));
  const col = document.elementFromPoint(e.clientX, e.clientY)?.closest('.col');
  if (col){
    col.classList.add('over');
    col.querySelector('.slot').classList.add('on');
    drag.target = col.dataset.col;
  } else drag.target = null;
});
addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.started){
    drag.fly.remove();
    if (drag.target){
      const t = TASKS.find(x => x.id === drag.id);
      TASKS = TASKS.filter(x => x.id !== drag.id);
      t.col = drag.target;
      TASKS.push(t);
    }
    render();
  }
  drag = null;
});
addEventListener('pointercancel', () => { if (drag?.fly) drag.fly.remove(); drag = null; render(); });

render();
</script>
</body>
</html>
