<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics Dashboard</title>
<style>
:root{
  --bg:#080c17;--card:#141b2b;--card2:#0e1422;--line:rgba(255,255,255,.08);
  --txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;
  --a:#7cc4ff;--b:#a98bff;--ok:#5fe0ac;--bad:#ff6b81;
  /* chart surface + validated categorical slots (dark, surface #141b2b):
     lightness band PASS · chroma PASS · CVD ΔE 9.4 PASS · normal ΔE 26.5 PASS · contrast PASS */
  --surface-1:#141b2b;
  --series-1:#3987e5;   /* blue   */
  --series-2:#d95926;   /* orange */
  --series-3:#199e70;   /* aqua   */
  --grid:rgba(255,255,255,.06);
}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:26px 20px;
font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}
body::before{content:"";position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(140px);
background:rgba(57,135,229,.13);top:-230px;left:-190px;pointer-events:none}

.dash{position:relative;z-index:1;width:min(720px,100%);
background:linear-gradient(168deg,var(--card),var(--card2));border:1px solid var(--line);
border-radius:24px;padding:22px;box-shadow:0 38px 84px -28px rgba(0,0,0,.86)}

.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;flex:1;font-size:18px;letter-spacing:-.02em}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.03)}
.seg button{padding:6px 12px;font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;
color:var(--dim);background:none;border:0;border-radius:8px;cursor:pointer;transition:.2s}
.seg button[aria-pressed="true"]{color:var(--txt);background:rgba(255,255,255,.09)}

/* ---------- stat tiles: a number is not a chart ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025)}
.tile span{display:block;font:600 9.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.13em;
text-transform:uppercase;color:var(--faint)}
.tile b{display:block;margin:3px 0 1px;font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--bad)}

.panel{padding:16px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.02);margin-bottom:12px}
.panel_hd{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.panel_hd h2{margin:0;flex:1;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.panel_hd p{margin:0;font-size:11.5px;color:var(--faint)}
.wrap{position:relative;margin-top:10px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.grid{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--dim);font:500 10px/1 ui-sans-serif;font-variant-numeric:tabular-nums}

/* one series: the title names it, so no legend box */
.area{fill:url(#fade)}
.line{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cross{stroke:rgba(255,255,255,.28);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.knob{fill:var(--series-1);stroke:var(--surface-1);stroke-width:2;opacity:0}

/* >=2 series: legend always present */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
.legend i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}

.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-118%);
padding:8px 10px;border-radius:10px;background:#070b14;border:1px solid rgba(255,255,255,.15);
box-shadow:0 14px 30px -12px rgba(0,0,0,.95);white-space:nowrap;transition:opacity .12s;z-index:3}
.tip b{display:block;font:600 9.5px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.1em;
text-transform:uppercase;color:var(--faint)}
.tip u{display:flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;color:var(--txt);
font-variant-numeric:tabular-nums}
.tip u i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}

table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin-top:11px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:600 9.5px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
td{color:var(--mut)}
[hidden]{display:none!important}
@media(max-width:560px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="dash">
  <div class="top">
    <h1>Platform overview</h1>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="vChart" aria-pressed="true">CHART</button>
      <button type="button" id="vTable" aria-pressed="false">TABLE</button>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><span>Requests / day</span><b>1.28M</b><em class="up">▲ 12.4% vs last week</em></div>
    <div class="tile"><span>p95 latency</span><b>184<small style="font-size:13px;color:var(--dim)">ms</small></b><em class="down">▼ 8.1% slower</em></div>
    <div class="tile"><span>Error rate</span><b>0.42%</b><em class="up">▼ 0.08pp &middot; within budget</em></div>
  </div>

  <div class="panel">
    <div class="panel_hd"><h2>Requests per day</h2><p>last 14 days</p></div>
    <div class="wrap" id="w1">
      <svg class="chart" id="c1" viewBox="0 0 660 200" role="img" aria-label="Requests per day over the last 14 days"></svg>
      <div class="tip" id="t1"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel_hd"><h2>Requests by surface</h2><p>weekly, millions</p></div>
    <div class="wrap" id="w2">
      <svg class="chart" id="c2" viewBox="0 0 660 200" role="img" aria-label="Requests by surface, weekly"></svg>
      <div class="tip" id="t2"></div>
    </div>
    <div class="legend" id="lg"></div>
  </div>

  <div id="tableView" hidden></div>
</section>

<script>
const $ = s => document.querySelector(s);
const S = ['var(--series-1)','var(--series-2)','var(--series-3)'];
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

/* ---------- data ---------- */
const DAYS = ['Aug 7','Aug 8','Aug 9','Aug 10','Aug 11','Aug 12','Aug 13','Aug 14','Aug 15','Aug 16','Aug 17','Aug 18','Aug 19','Aug 20'];
const REQ  = [980,1042,1015,1130,1188,905,860,1210,1265,1240,1302,1348,1120,1284];
const WEEKS = ['Wk 30','Wk 31','Wk 32','Wk 33','Wk 34'];
const SERIES = [
  { name:'Web',    data:[3.1,3.4,3.2,3.9,4.2] },
  { name:'Mobile', data:[2.2,2.4,2.9,3.1,3.6] },
  { name:'API',    data:[1.4,1.6,1.5,1.9,2.1] }
];

/* ---------- line + area, one series ---------- */
(function lineChart(){
  const svg = $('#c1'), tip = $('#t1'), W = 660, H = 200, P = { l:40, r:10, t:14, b:26 };
  const max = 1450, min = 700;
  const x = i => P.l + i * (W - P.l - P.r) / (REQ.length - 1);
  const y = v => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);

  const defs = el('defs');
  const g = el('linearGradient', { id:'fade', x1:0, y1:0, x2:0, y2:1 });
  g.appendChild(el('stop', { offset:'0', 'stop-color':'#3987e5', 'stop-opacity':'.34' }));
  g.appendChild(el('stop', { offset:'1', 'stop-color':'#3987e5', 'stop-opacity':'0' }));
  defs.appendChild(g); svg.appendChild(defs);

  [700,950,1200,1450].forEach(v => {
    svg.appendChild(el('line', { class:'grid', x1:P.l, x2:W - P.r, y1:y(v), y2:y(v) }));
    const t = el('text', { class:'axis', x:P.l - 8, y:y(v) + 3.5, 'text-anchor':'end' });
    t.textContent = (v / 1000).toFixed(2).replace(/0$/,'') + 'M'; svg.appendChild(t);
  });
  [0, 4, 9, 13].forEach(i => {
    const t = el('text', { class:'axis', x:x(i), y:H - 8, 'text-anchor':i === 0 ? 'start' : i === 13 ? 'end' : 'middle' });
    t.textContent = DAYS[i]; svg.appendChild(t);
  });

  const pts = REQ.map((v, i) => x(i).toFixed(1) + ' ' + y(v).toFixed(1));
  svg.appendChild(el('path', { class:'area', d:'M' + pts.join(' L') + ' L' + x(13) + ' ' + y(min) + ' L' + x(0) + ' ' + y(min) + ' Z' }));
  svg.appendChild(el('path', { class:'line', d:'M' + pts.join(' L') }));

  const cross = el('line', { class:'cross', y1:P.t, y2:H - P.b }); svg.appendChild(cross);
  const knob = el('circle', { class:'knob', r:5 }); svg.appendChild(knob);

  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * W;
    let i = Math.round((px - P.l) / ((W - P.l - P.r) / 13));
    i = Math.max(0, Math.min(13, i));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.style.opacity = 1;
    knob.setAttribute('cx', x(i)); knob.setAttribute('cy', y(REQ[i])); knob.style.opacity = 1;
    tip.innerHTML = '<b>' + DAYS[i] + '</b><u><i style="background:var(--series-1)"></i>' +
      (REQ[i] / 1000).toFixed(3) + 'M requests</u>';
    tip.style.left = (x(i) / W * 100) + '%';
    tip.style.top = (y(REQ[i]) / H * 100) + '%';
    tip.style.opacity = 1;
  });
  svg.addEventListener('pointerleave', () => { tip.style.opacity = 0; cross.style.opacity = 0; knob.style.opacity = 0; });
})();

/* ---------- grouped bars, three series ---------- */
(function barChart(){
  const svg = $('#c2'), tip = $('#t2'), W = 660, H = 200, P = { l:34, r:10, t:14, b:26 };
  const max = 5;
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  const base = y(0);
  const bandW = (W - P.l - P.r) / WEEKS.length;
  const GAP = 2;                                   // 2px surface gap between adjacent bars
  const barW = (bandW * .66 - GAP * 2) / 3;

  [0,1,2,3,4,5].forEach(v => {
    svg.appendChild(el('line', { class:'grid', x1:P.l, x2:W - P.r, y1:y(v), y2:y(v) }));
    const t = el('text', { class:'axis', x:P.l - 8, y:y(v) + 3.5, 'text-anchor':'end' });
    t.textContent = v; svg.appendChild(t);
  });

  /* 4px rounded data-end, square where it meets the baseline */
  const cap = (bx, by, w, h, r) => {
    r = Math.min(r, h, w / 2);
    return `M${bx} ${by + h} L${bx} ${by + r} Q${bx} ${by} ${bx + r} ${by}` +
           ` L${bx + w - r} ${by} Q${bx + w} ${by} ${bx + w} ${by + r} L${bx + w} ${by + h} Z`;
  };

  WEEKS.forEach((wk, gi) => {
    const gx = P.l + gi * bandW + bandW * .17;
    SERIES.forEach((s, si) => {
      const bx = gx + si * (barW + GAP), v = s.data[gi];
      const p = el('path', { d:cap(bx, y(v), barW, base - y(v), 4), fill:S[si] });
      p.style.cursor = 'crosshair';
      p.addEventListener('pointerenter', () => {
        tip.innerHTML = '<b>' + wk + ' &middot; ' + s.name + '</b><u><i style="background:' + S[si] + '"></i>' + v.toFixed(1) + 'M requests</u>';
        tip.style.left = ((bx + barW / 2) / W * 100) + '%';
        tip.style.top = (y(v) / H * 100) + '%';
        tip.style.opacity = 1;
      });
      p.addEventListener('pointerleave', () => tip.style.opacity = 0);
      svg.appendChild(p);
    });
    const t = el('text', { class:'axis', x:P.l + gi * bandW + bandW / 2, y:H - 8, 'text-anchor':'middle' });
    t.textContent = wk; svg.appendChild(t);
  });

  $('#lg').innerHTML = SERIES.map((s, i) =>
    '<span><i style="background:' + S[i] + '"></i>' + s.name + '</span>').join('');
})();

/* ---------- the same numbers, readable without colour ---------- */
$('#tableView').innerHTML =
  '<div class="panel"><div class="panel_hd"><h2>Requests per day</h2></div><table><thead><tr><th>Day</th><th>Requests</th></tr></thead><tbody>' +
  DAYS.map((d, i) => '<tr><td>' + d + '</td><td>' + REQ[i].toLocaleString() + 'K</td></tr>').join('') +
  '</tbody></table></div>' +
  '<div class="panel"><div class="panel_hd"><h2>Requests by surface</h2></div><table><thead><tr><th>Week</th>' +
  SERIES.map(s => '<th>' + s.name + '</th>').join('') + '</tr></thead><tbody>' +
  WEEKS.map((w, i) => '<tr><td>' + w + '</td>' + SERIES.map(s => '<td>' + s.data[i].toFixed(1) + 'M</td>').join('') + '</tr>').join('') +
  '</tbody></table></div>';

const panels = document.querySelectorAll('.dash > .panel');
function view(isChart){
  panels.forEach(p => p.hidden = !isChart);
  $('#tableView').hidden = isChart;
  $('#vChart').setAttribute('aria-pressed', isChart);
  $('#vTable').setAttribute('aria-pressed', !isChart);
}
$('#vChart').addEventListener('click', () => view(true));
$('#vTable').addEventListener('click', () => view(false));
</script>
</body>
</html>
