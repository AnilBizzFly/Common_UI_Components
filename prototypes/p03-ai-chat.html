<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat</title>
<style>
:root{--bg:#080c17;--card:#141b2b;--card2:#0e1422;--line:rgba(255,255,255,.08);
--txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;--a:#7cc4ff;--b:#a98bff;--ok:#5fe0ac}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 20px;
font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}
body::before{content:"";position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(130px);
background:rgba(169,139,255,.12);top:-220px;right:-180px;pointer-events:none}

.app{position:relative;z-index:1;width:min(560px,100%);height:min(680px,88vh);display:flex;flex-direction:column;
background:linear-gradient(168deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:24px;
overflow:hidden;box-shadow:0 38px 84px -28px rgba(0,0,0,.86)}

.hd{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 16px -6px rgba(124,196,255,.7)}
.dot svg{width:15px;height:15px;fill:none;stroke:#07121d;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hd b{flex:1;font-size:14px;font-weight:650;letter-spacing:-.01em}
.hd .live{display:flex;align-items:center;gap:6px;font:600 9.5px/1 ui-monospace,Menlo,monospace;
letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.hd .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

.feed{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.msg{display:flex;gap:10px;max-width:88%;animation:rise .34s cubic-bezier(.3,1.2,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:27px;height:27px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
font:700 11px/1 ui-sans-serif;background:rgba(255,255,255,.07);color:var(--mut)}
.msg.ai .av{background:linear-gradient(135deg,var(--a),var(--b));color:#07121d}
.bub{padding:11px 14px;border-radius:15px;font-size:14px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.msg.ai .bub{background:rgba(255,255,255,.05);border:1px solid var(--line);border-top-left-radius:5px}
.msg.me .bub{background:linear-gradient(115deg,var(--a),var(--b));color:#07121d;font-weight:500;border-top-right-radius:5px}
.bub code{padding:1px 5px;border-radius:5px;background:rgba(124,196,255,.14);color:var(--a);
font:600 12.5px/1 ui-monospace,Menlo,monospace}
.caret{display:inline-block;width:7px;height:15px;margin-left:1px;vertical-align:-2px;border-radius:1px;
background:var(--a);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.tools{display:flex;gap:5px;margin-top:7px;opacity:0;transition:opacity .2s}
.msg.ai:hover .tools,.msg.ai:focus-within .tools{opacity:1}
.tools button{padding:3px 8px;font:600 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.06em;
color:var(--faint);background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:.2s}
.tools button:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}

.chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px;flex:0 0 auto}
.chip{padding:7px 12px;font:inherit;font-size:12px;color:var(--mut);background:rgba(255,255,255,.04);
border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:.2s}
.chip:hover{color:var(--txt);border-color:var(--a);background:rgba(124,196,255,.1)}

.bar{display:flex;align-items:flex-end;gap:9px;padding:13px 15px;border-top:1px solid var(--line);flex:0 0 auto}
textarea{flex:1;min-height:42px;max-height:130px;padding:11px 13px;font:inherit;font-size:14px;color:var(--txt);
background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;outline:none;resize:none;
transition:border-color .2s,box-shadow .2s}
textarea::placeholder{color:var(--faint)}
textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(124,196,255,.13)}
.send{width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:13px;cursor:pointer;
background:linear-gradient(115deg,var(--a),var(--b));box-shadow:0 10px 22px -9px rgba(124,196,255,.7);transition:.18s}
.send:disabled{opacity:.35;cursor:default;box-shadow:none}
.send svg{width:17px;height:17px;fill:none;stroke:#07121d;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.send.stop{background:rgba(255,255,255,.1);box-shadow:none}
.send.stop svg{stroke:var(--txt)}
</style>
</head>
<body>

<div class="app">
  <div class="hd">
    <span class="dot"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3.4"/></svg></span>
    <b>Atlas Assistant</b>
    <span class="live">online</span>
  </div>

  <div class="feed" id="feed" aria-live="polite"></div>

  <div class="chips" id="chips">
    <button class="chip" type="button">Summarise last week's deploys</button>
    <button class="chip" type="button">Why is p95 latency up?</button>
    <button class="chip" type="button">Draft the release notes</button>
  </div>

  <div class="bar">
    <textarea id="ta" rows="1" placeholder="Ask anything…  (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="send" id="send" type="button" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script>
const feed = document.getElementById('feed'), ta = document.getElementById('ta'),
      send = document.getElementById('send'), chips = document.getElementById('chips');
let streaming = null;

const REPLIES = [
  "Deploys are healthy. 27 shipped last week across 4 services, with 2 rollbacks — both on `checkout-api`, both triggered by the same failing migration.\n\nThe pattern worth watching: every rollback happened inside the Friday freeze window. Worth moving that job to Tuesday.",
  "p95 moved from 180ms to 340ms on Wednesday 14:20, and it tracks exactly with the `search-index` rebuild.\n\nThe rebuild holds a read lock for about 40 seconds per shard, and with 6 shards running serially you get a ~4 minute window where queries queue. Parallelising the shards should flatten it.",
  "Here's a draft:\n\n**v2.4.0** — Faster search, calmer alerts.\n\n• Search index rebuilds now run in parallel, cutting p95 during reindex by roughly 60%\n• Alert rules support inhibition windows\n• Fixed a rollback loop in `checkout-api` migrations\n\nWant it longer, or is that the right length?"
];
let turn = 0;

function bubble(who, text){
  const m = document.createElement('div');
  m.className = 'msg ' + who;
  m.innerHTML = '<span class="av">' + (who === 'me' ? 'You' : 'A') + '</span>' +
                '<div><div class="bub"></div></div>';
  m.querySelector('.bub').textContent = text;
  feed.appendChild(m);
  feed.scrollTop = feed.scrollHeight;
  return m.querySelector('.bub');
}
const fmt = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

/* token-by-token, the way a real stream arrives */
function stream(bub, text, done){
  const words = text.split(/(\s+)/);
  let i = 0;
  bub.innerHTML = '<span class="caret"></span>';
  const tick = () => {
    if (streaming === null) return;
    i += 1 + Math.floor(Math.random() * 2);
    const part = words.slice(0, i).join('');
    bub.innerHTML = fmt(part) + (i < words.length ? '<span class="caret"></span>' : '');
    feed.scrollTop = feed.scrollHeight;
    if (i < words.length) streaming = setTimeout(tick, 22 + Math.random() * 46);
    else done();
  };
  streaming = setTimeout(tick, 260);
}

function ask(text){
  if (streaming) return;
  bubble('me', text);
  ta.value = ''; sizeTa(); gate();
  chips.style.display = 'none';

  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.innerHTML = '<span class="av">A</span><div><div class="bub"></div>' +
    '<div class="tools"><button type="button" data-copy>copy</button>' +
    '<button type="button" data-again>regenerate</button></div></div>';
  feed.appendChild(wrap);
  const bub = wrap.querySelector('.bub');
  const body = REPLIES[turn % REPLIES.length]; turn++;

  send.classList.add('stop');
  send.innerHTML = '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>';
  send.disabled = false;

  stream(bub, body, () => {
    streaming = null;
    send.classList.remove('stop');
    send.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
    gate();
  });

  wrap.querySelector('[data-copy]').addEventListener('click', e => {
    navigator.clipboard && navigator.clipboard.writeText(bub.textContent);
    e.target.textContent = 'copied'; setTimeout(() => e.target.textContent = 'copy', 1400);
  });
  wrap.querySelector('[data-again]').addEventListener('click', () => {
    if (streaming) return;
    stream(bub, REPLIES[(turn++) % REPLIES.length], () => streaming = null);
  });
}

function sizeTa(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 130) + 'px'; }
function gate(){ if (!streaming) send.disabled = !ta.value.trim(); }

ta.addEventListener('input', () => { sizeTa(); gate(); });
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (ta.value.trim() && !streaming) ask(ta.value.trim()); }
});
send.addEventListener('click', () => {
  if (streaming){ clearTimeout(streaming); streaming = null;
    send.classList.remove('stop');
    send.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
    document.querySelectorAll('.caret').forEach(c => c.remove()); gate(); return; }
  if (ta.value.trim()) ask(ta.value.trim());
});
chips.addEventListener('click', e => { if (e.target.classList.contains('chip')) ask(e.target.textContent); });

bubble('ai', 'Hi — I can read your deploys, metrics and issues. Ask me anything, or pick a starting point below.');
</script>
</body>
</html>
