<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Range Picker</title>
<style>
:root{--bg:#080c17;--card:#141b2b;--card2:#0e1422;--line:rgba(255,255,255,.08);
--txt:#e9edf8;--mut:#8b95b3;--dim:#5a6482;--faint:#3c4562;--a:#7cc4ff;--b:#a98bff;--ok:#5fe0ac}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:26px 20px;
font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg)}
body::before{content:"";position:fixed;width:620px;height:620px;border-radius:50%;filter:blur(140px);
background:rgba(124,196,255,.11);top:-250px;left:-200px;pointer-events:none}

.pk{position:relative;z-index:1;width:min(640px,100%);display:flex;
background:linear-gradient(168deg,var(--card),var(--card2));border:1px solid var(--line);
border-radius:22px;overflow:hidden;box-shadow:0 38px 84px -28px rgba(0,0,0,.86)}

.presets{flex:0 0 150px;padding:14px 12px;border-right:1px solid var(--line);
display:flex;flex-direction:column;gap:2px}
.presets h2{margin:0 0 8px 8px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;
text-transform:uppercase;color:var(--faint)}
.presets button{text-align:left;padding:9px 10px;font:inherit;font-size:12.5px;font-weight:550;
color:var(--mut);background:none;border:0;border-radius:9px;cursor:pointer;transition:.18s}
.presets button:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.presets button[aria-pressed="true"]{color:var(--a);background:rgba(124,196,255,.13);
box-shadow:inset 0 0 0 1px rgba(124,196,255,.28)}

.right{flex:1;min-width:0;display:flex;flex-direction:column}
.cal_hd{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.cal_hd b{flex:1;text-align:center;font-size:13px;font-weight:650;letter-spacing:-.01em}
.arrow{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--dim);
background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;transition:.18s}
.arrow:hover{color:var(--txt);background:rgba(255,255,255,.1)}
.arrow svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.months{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:4px 16px 12px}
.m h3{margin:0 0 8px;text-align:center;font:600 11px/1 ui-monospace,Menlo,monospace;
letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;padding:4px 0;font:600 9px/1 ui-monospace,Menlo,monospace;color:var(--faint)}
.days button{position:relative;aspect-ratio:1;font:inherit;font-size:12px;font-weight:550;
color:var(--mut);background:none;border:0;cursor:pointer;font-variant-numeric:tabular-nums;
transition:color .15s,background .15s}
.days button:disabled{color:transparent;cursor:default;pointer-events:none}
.days button:hover:not(:disabled){color:var(--txt)}
.days button.in{background:rgba(124,196,255,.12);color:var(--txt)}
.days button.pv{background:rgba(124,196,255,.07)}
.days button.end{color:#07121d;font-weight:700;background:linear-gradient(115deg,var(--a),var(--b));
border-radius:9px;box-shadow:0 6px 16px -7px rgba(124,196,255,.9);z-index:1}
.days button.s1.in{border-radius:9px 0 0 9px}
.days button.s2.in{border-radius:0 9px 9px 0}
.days button.today::after{content:"";position:absolute;left:50%;bottom:5px;width:3px;height:3px;
margin-left:-1.5px;border-radius:50%;background:var(--ok)}
.days button.end.today::after{background:#07121d}

.ft{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);margin-top:auto}
.ft .out{flex:1;min-width:0;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.ft .out b{color:var(--txt);font-weight:650}
.ft .out span{display:block;font:600 9.5px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.1em;
text-transform:uppercase;color:var(--faint)}
.ft button{padding:9px 15px;font:inherit;font-size:12.5px;font-weight:650;border-radius:10px;cursor:pointer}
.ghost{color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ghost:hover{color:var(--txt)}
.apply{color:#07121d;background:linear-gradient(115deg,var(--a),var(--b));border:0;
box-shadow:0 10px 24px -10px rgba(124,196,255,.7)}
@media(max-width:620px){.pk{flex-direction:column}.presets{flex:none;border-right:0;border-bottom:1px solid var(--line);
flex-direction:row;flex-wrap:wrap}.presets h2{display:none}.months{grid-template-columns:1fr}.m:last-child{display:none}}
</style>
</head>
<body>

<section class="pk">
  <div class="presets" id="presets">
    <h2>Quick ranges</h2>
    <button type="button" data-p="7">Last 7 days</button>
    <button type="button" data-p="30" aria-pressed="true">Last 30 days</button>
    <button type="button" data-p="90">Last 90 days</button>
    <button type="button" data-p="tm">This month</button>
    <button type="button" data-p="lm">Last month</button>
    <button type="button" data-p="ytd">Year to date</button>
  </div>

  <div class="right">
    <div class="cal_hd">
      <button class="arrow" type="button" id="back" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <b id="span"></b>
      <button class="arrow" type="button" id="fwd" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
    <div class="months" id="months"></div>
    <div class="ft">
      <span class="out" id="out"></span>
      <button class="ghost" type="button" id="clear">Clear</button>
      <button class="apply" type="button" id="apply">Apply</button>
    </div>
  </div>
</section>

<script>
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const TODAY = new Date(2026, 7, 20);                       // fixed so the demo is reproducible
const key = d => d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate();
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmt = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });

let cursor = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1);
let from = addD(TODAY, -29), to = new Date(TODAY), hover = null, picking = false;

function month(base, off){
  const d = new Date(base.getFullYear(), base.getMonth() + off, 1);
  const first = (d.getDay() + 6) % 7;                       // Monday-first
  const len = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<button disabled></button>';
  for (let n = 1; n <= len; n++){
    const cur = new Date(d.getFullYear(), d.getMonth(), n), k = key(cur);
    const end = picking && hover ? (key(hover) > key(from) ? hover : from) : to;
    const start = picking && hover ? (key(hover) > key(from) ? from : hover) : from;
    const isEnd = (start && k === key(start)) || (end && k === key(end));
    const inRange = start && end && k >= key(start) && k <= key(end);
    const cls = [
      inRange ? (picking ? 'pv in' : 'in') : '',
      isEnd ? 'end' : '',
      start && k === key(start) ? 's1' : '',
      end && k === key(end) ? 's2' : '',
      k === key(TODAY) ? 'today' : ''
    ].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-d="${cur.toISOString().slice(0,10)}">${n}</button>`;
  }
  return `<div class="m"><h3>${MN[d.getMonth()]} ${d.getFullYear()}</h3>
    <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="days">${cells}</div></div>`;
}

function render(){
  document.getElementById('months').innerHTML = month(cursor, 0) + month(cursor, 1);
  const a = new Date(cursor), b = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  document.getElementById('span').textContent = MN[a.getMonth()].slice(0,3) + ' – ' + MN[b.getMonth()].slice(0,3) + ' ' + b.getFullYear();
  const days = from && to ? Math.round((to - from) / 864e5) + 1 : 0;
  document.getElementById('out').innerHTML = from && to
    ? `<b>${fmt(from)} → ${fmt(to)}</b><span>${days} days</span>`
    : `<b>Pick a start date</b><span>then an end date</span>`;
}

document.getElementById('months').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const d = new Date(b.dataset.d + 'T00:00:00');
  if (!picking){ from = d; to = null; picking = true; hover = null; }
  else {
    if (key(d) < key(from)){ to = from; from = d; } else to = d;
    picking = false;
  }
  document.querySelectorAll('[data-p]').forEach(p => p.setAttribute('aria-pressed','false'));
  render();
});
document.getElementById('months').addEventListener('pointermove', e => {
  if (!picking) return;
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const d = new Date(b.dataset.d + 'T00:00:00');
  if (!hover || key(hover) !== key(d)){ hover = d; render(); }
});

document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]'); if (!b) return;
  document.querySelectorAll('[data-p]').forEach(p => p.setAttribute('aria-pressed', p === b));
  const p = b.dataset.p;
  picking = false; hover = null; to = new Date(TODAY);
  if (p === 'tm'){ from = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); }
  else if (p === 'lm'){ from = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1);
                        to = new Date(TODAY.getFullYear(), TODAY.getMonth(), 0); }
  else if (p === 'ytd'){ from = new Date(TODAY.getFullYear(), 0, 1); }
  else from = addD(TODAY, -(+p - 1));
  cursor = new Date(from.getFullYear(), from.getMonth(), 1);
  if (key(to) > key(new Date(cursor.getFullYear(), cursor.getMonth() + 2, 0)))
    cursor = new Date(to.getFullYear(), to.getMonth() - 1, 1);
  render();
});

document.getElementById('back').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() - 1); render(); });
document.getElementById('fwd').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() + 1); render(); });
document.getElementById('clear').addEventListener('click', () => { from = to = hover = null; picking = false; render(); });
document.getElementById('apply').addEventListener('click', () =>
  alert(from && to ? 'Applied ' + fmt(from) + ' → ' + fmt(to) : 'Pick a range first'));

render();
</script>
</body>
</html>
