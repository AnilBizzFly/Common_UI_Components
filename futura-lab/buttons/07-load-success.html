<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Load &rarr; Success</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#31e0ff}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.b{position:relative;border:0;cursor:pointer;font:650 15px/1 ui-sans-serif,system-ui;
  padding:16px 30px;border-radius:15px;color:#fff;background:rgba(255,255,255,.08);
  isolation:isolate;overflow:hidden;-webkit-tap-highlight-color:transparent}

.b-load{background:linear-gradient(130deg,#31e0ff,#7c5cff);color:#07080f;width:168px;height:54px;
  padding:0;border-radius:15px;font-size:15px;
  transition:width .45s cubic-bezier(.4,1.4,.4,1),border-radius .45s,background .4s}
.b-load .t{transition:opacity .2s}
.b-load .sp,.b-load .ok{position:absolute;inset:0;display:grid;place-items:center;opacity:0;
  transition:opacity .2s}
.b-load .sp i{width:21px;height:21px;border-radius:50%;border:2.6px solid rgba(7,8,15,.3);
  border-top-color:#07080f;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.b-load[data-s="load"]{width:54px;border-radius:50%}
.b-load[data-s="load"] .t{opacity:0}
.b-load[data-s="load"] .sp{opacity:1}
.b-load[data-s="ok"]{width:54px;border-radius:50%;background:linear-gradient(130deg,#3dffa8,#25d9e6)}
.b-load[data-s="ok"] .t{opacity:0}
.b-load[data-s="ok"] .ok{opacity:1}
.b-load .ok svg{width:24px;height:24px;fill:none;stroke:#07080f;stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;animation:draw .4s .08s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; buttons</a>
  <span class="rt"><a href="06-glitch.html" title="previous">&larr;</a><a href="08-hold-confirm.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Buttons &middot; 07 / 24</p>
  <h1>Load &rarr; Success</h1>
  <p class="desc">Click and the button collapses to a circle, spins, then turns green and draws a tick before resetting.</p>
  <div class="demo">
    <button class="b b-load" id="load" data-s="idle">
      <span class="t">Deploy</span>
      <span class="sp"><i></i></span>
      <span class="ok"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
    </button>
  </div>
  <p class="note">One <b>data-s</b> word drives all three states: idle / load / ok.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const load=$('load');
load.addEventListener('click',()=>{
  if(load.dataset.s!=='idle') return;
  load.dataset.s='load';
  setTimeout(()=>{ load.dataset.s='ok'; setTimeout(()=>load.dataset.s='idle',1600); },
    reduce?200:1600);
});
</script>
</body>
</html>
