<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Validation</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#4dffcf}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.msg{min-height:17px;margin-top:8px;font:500 11.5px/1.35 ui-sans-serif,system-ui;color:#ff8a9c;
  opacity:0;transition:opacity .2s}
.msg[data-show]{opacity:1}

.vf{position:relative}
.vf input{width:100%;padding:17px 48px 17px 46px;border-radius:14px;font:inherit;font-size:14.5px;
  color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);outline:none;
  transition:border-color .25s,box-shadow .25s}
.vf input:focus{border-color:color-mix(in srgb,var(--c) 60%,transparent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent)}
.vf > svg{position:absolute;left:16px;top:50%;margin-top:-8px;width:17px;height:17px;
  stroke:rgba(233,237,255,.35);fill:none;stroke-width:1.9}
.vf .mark{position:absolute;right:16px;top:50%;margin-top:-9px;width:19px;height:19px;opacity:0;
  transform:scale(.5);transition:.3s cubic-bezier(.2,1.6,.4,1)}
.vf[data-v="ok"] .mark.ok,.vf[data-v="bad"] .mark.bad{opacity:1;transform:scale(1)}
.vf[data-v="ok"] input{border-color:#4dffcf}
.vf[data-v="bad"] input{border-color:#ff5e79}
.mark svg{width:19px;height:19px;fill:none;stroke-width:2.6;stroke-linecap:round}
.mark.ok svg{stroke:#4dffcf}.mark.bad svg{stroke:#ff5e79}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; forms</a>
  <span class="rt"><a href="01-floating-label.html" title="previous">&larr;</a><a href="03-password-strength.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Forms &middot; 02 / 15</p>
  <h1>Live Validation</h1>
  <p class="desc">Checks the address on every keystroke and swaps a tick or a cross in, with the reason underneath.</p>
  <div class="demo block">
    <div class="vf" id="vf">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
      <input id="email" placeholder="you@studio.com" autocomplete="off">
      <span class="mark ok"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
      <span class="mark bad"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <p class="note">Empty is neutral &mdash; it only judges you once you have typed something.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const email=$('email'), vf=$('vf'), msg=$('msg');
email.addEventListener('input',()=>{
  const v=email.value.trim();
  if(!v){ vf.removeAttribute('data-v'); msg.removeAttribute('data-show'); return; }
  const ok=/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v);
  vf.dataset.v = ok?'ok':'bad';
  msg.textContent = ok ? '' : 'That is not a complete address yet.';
  msg.toggleAttribute('data-show',!ok);
});
</script>
</body>
</html>
