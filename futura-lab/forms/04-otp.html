<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTP Field</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#7c5cff}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.otp{display:flex;gap:9px;justify-content:space-between}
.otp input{width:100%;aspect-ratio:1/1.15;min-width:0;text-align:center;border-radius:14px;
  font:650 22px/1 ui-monospace,Menlo,monospace;color:#fff;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);outline:none;caret-color:var(--c);
  transition:border-color .2s,transform .25s cubic-bezier(.2,1.6,.4,1),box-shadow .2s,background .3s}
.otp input:focus{border-color:var(--c);transform:translateY(-4px);
  box-shadow:0 10px 24px -10px var(--c)}
.otp input:not(:placeholder-shown){border-color:rgba(77,255,207,.5);background:rgba(77,255,207,.08)}
[data-otp="bad"] .otp{animation:shake .36s}
[data-otp="ok"] .otp input{border-color:#4dffcf;background:rgba(77,255,207,.16)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{margin-top:12px;font:500 11.5px/1.4 ui-monospace,monospace;color:rgba(233,237,255,.4);
  text-align:center}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; forms</a>
  <span class="rt"><a href="03-password-strength.html" title="previous">&larr;</a><a href="05-search-highlight.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Forms &middot; 04 / 15</p>
  <h1>OTP Field</h1>
  <p class="desc">Six boxes that auto-advance, walk backwards on delete, accept a pasted code, and shake when it is wrong.</p>
  <div class="demo block">
    <div id="cell">
      <div class="otp" id="otp">
        <input maxlength="1" inputmode="numeric" placeholder=" ">
        <input maxlength="1" inputmode="numeric" placeholder=" ">
        <input maxlength="1" inputmode="numeric" placeholder=" ">
        <input maxlength="1" inputmode="numeric" placeholder=" ">
        <input maxlength="1" inputmode="numeric" placeholder=" ">
        <input maxlength="1" inputmode="numeric" placeholder=" ">
      </div>
      <div class="hint" id="hint">enter the 6-digit code</div>
    </div>
  </div>
  <p class="note">The code is <b>428910</b>. Paste it whole &mdash; it distributes across the boxes.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const cell=$('cell'), hint=$('hint');
const box=[...$('otp').querySelectorAll('input')];
box.forEach((el,i)=>{
  el.addEventListener('input',()=>{
    el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);
    if(el.value && i<box.length-1) box[i+1].focus();
    check();
  });
  el.addEventListener('keydown',e=>{
    if(e.key==='Backspace' && !el.value && i>0){ box[i-1].focus(); box[i-1].value=''; check(); }
    if(e.key==='ArrowLeft' && i>0) box[i-1].focus();
    if(e.key==='ArrowRight' && i<box.length-1) box[i+1].focus();
  });
  el.addEventListener('paste',e=>{
    e.preventDefault();
    const d=(e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').split('');
    box.forEach((x,n)=>x.value=d[n]||'');
    box[Math.min(d.length,5)].focus(); check();
  });
});
function check(){
  const code=box.map(x=>x.value).join('');
  cell.removeAttribute('data-otp');
  if(code.length<6){ hint.textContent='enter the 6-digit code';
    hint.style.color='rgba(233,237,255,.4)'; return; }
  if(code==='428910'){ cell.dataset.otp='ok'; hint.textContent='Verified'; hint.style.color='#4dffcf'; }
  else{
    cell.dataset.otp='bad'; hint.textContent='Wrong code'; hint.style.color='#ff8a9c';
    setTimeout(()=>{ box.forEach(x=>x.value=''); box[0].focus();
      cell.removeAttribute('data-otp'); },750);
  }
}
box[0].focus();
</script>
</body>
</html>
