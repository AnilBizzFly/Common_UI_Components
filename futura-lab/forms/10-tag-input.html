<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tag Input</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#ff9ee0}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.tags{display:flex;flex-wrap:wrap;gap:7px;padding:11px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:text;transition:.25s;
  min-height:58px;align-items:center}
.tags:focus-within{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 13%,transparent)}
.tag{display:flex;align-items:center;gap:7px;padding:8px 9px 8px 13px;border-radius:10px;
  font:600 12.5px/1 ui-sans-serif,system-ui;color:#07080f;
  background:linear-gradient(130deg,#fff,#ffd2ef);animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.tag button{border:0;background:rgba(0,0,0,.18);color:#07080f;width:16px;height:16px;border-radius:50%;
  cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.tags input{flex:1;min-width:90px;border:0;background:none;outline:none;color:#fff;font:inherit;
  font-size:14px;padding:7px 4px}
.count{margin-top:10px;font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(233,237,255,.3)}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; forms</a>
  <span class="rt"><a href="09-combobox.html" title="previous">&larr;</a><a href="11-dropzone.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Forms &middot; 10 / 15</p>
  <h1>Tag Input</h1>
  <p class="desc">Enter or comma commits a tag, backspace on an empty field eats the last one, and every chip has its own remove.</p>
  <div class="demo block">
    <div class="tags" id="box"><input id="in" placeholder="Add a tag, press Enter"></div>
    <div class="count" id="count"></div>
  </div>
  <p class="note">Duplicates are rejected silently &mdash; the field just clears.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const box=$('box'), input=$('in'), count=$('count');
let tags=['motion','glass','tokens'];
function draw(){
  [...box.querySelectorAll('.tag')].forEach(t=>t.remove());
  tags.forEach((t,i)=>{
    const el=document.createElement('span'); el.className='tag';
    el.innerHTML=t+'<button aria-label="remove">&times;</button>';
    el.querySelector('button').addEventListener('click',()=>{ tags.splice(i,1); draw(); });
    box.insertBefore(el,input);
  });
  count.textContent=tags.length+' tag'+(tags.length===1?'':'s');
}
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const v=input.value.trim().replace(/,/g,'');
    if(v && !tags.includes(v)){ tags.push(v); draw(); }
    input.value='';
  }
  if(e.key==='Backspace' && !input.value && tags.length){ tags.pop(); draw(); }
});
box.addEventListener('click',()=>input.focus());
draw();
</script>
</body>
</html>
