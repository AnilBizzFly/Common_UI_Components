<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search + Highlight</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#8ee7ff}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.sb{position:relative;display:flex;align-items:center;gap:10px;padding:15px 16px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:.25s}
.sb:focus-within{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent)}
.sb svg{width:17px;height:17px;stroke:rgba(233,237,255,.4);fill:none;stroke-width:2;flex:none}
.sb input{flex:1;min-width:0;border:0;background:none;outline:none;color:#fff;font:inherit;font-size:14.5px}
.sb .clr{border:0;background:rgba(255,255,255,.1);color:#fff;width:22px;height:22px;border-radius:50%;
  cursor:pointer;font-size:13px;line-height:1;opacity:0;pointer-events:none;transition:.2s}
.sb[data-has] .clr{opacity:1;pointer-events:auto}
.hits{margin-top:12px;display:flex;flex-direction:column;gap:7px;max-height:180px;overflow-y:auto}
.hit{padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13.5px;
  border:1px solid rgba(255,255,255,.06);animation:fade .32s both}
.hit b{color:var(--c);font-weight:700}
@keyframes fade{from{opacity:0;transform:translateY(7px)}}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; forms</a>
  <span class="rt"><a href="04-otp.html" title="previous">&larr;</a><a href="06-range-bubble.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Forms &middot; 05 / 15</p>
  <h1>Search + Highlight</h1>
  <p class="desc">Filters as you type and marks the matched substring inside each result, with a clear button that appears only when needed.</p>
  <div class="demo block">
    <div class="sb" id="sb">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search components&hellip;" autocomplete="off">
      <button class="clr" id="clr" aria-label="clear">&times;</button>
    </div>
    <div class="hits" id="hits"></div>
  </div>
  <p class="note">Results stagger in at <b>35ms</b> intervals so the list feels assembled, not dumped.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const DATA=['Magnetic button','Gooey split','Liquid fill','Border beam','Glass card','Spotlight card',
  'Text scramble','Odometer counter','Marquee strip','OTP field','Dropzone','Combobox','Stepper',
  'Rating stars','Swipe deck','Tag input'];
const q=$('q'), hits=$('hits'), sb=$('sb');
function search(){
  const s=q.value.trim().toLowerCase();
  sb.toggleAttribute('data-has',!!s);
  const list=(s?DATA.filter(d=>d.toLowerCase().includes(s)):DATA).slice(0,7);
  hits.innerHTML = list.length ? list.map((d,i)=>{
    const at=d.toLowerCase().indexOf(s);
    const html = s&&at>=0 ? d.slice(0,at)+'<b>'+d.slice(at,at+s.length)+'</b>'+d.slice(at+s.length) : d;
    return '<div class="hit" style="animation-delay:'+(i*35)+'ms">'+html+'</div>';
  }).join('') : '<div class="hit">No match</div>';
}
q.addEventListener('input',search);
$('clr').addEventListener('click',()=>{ q.value=''; q.focus(); search(); });
search();
</script>
</body>
</html>
