<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Strength</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#ffd23d}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.pw{position:relative}
.pw input{width:100%;padding:17px 50px 17px 15px;border-radius:14px;font:inherit;font-size:14.5px;
  color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);outline:none;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em}
.pw input:focus{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.pw .eye{position:absolute;right:9px;top:50%;margin-top:-17px;width:34px;height:34px;border:0;
  background:none;cursor:pointer;color:rgba(233,237,255,.45);display:grid;place-items:center;
  border-radius:9px;transition:.2s}
.pw .eye:hover{color:#fff;background:rgba(255,255,255,.09)}
.pw .eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9}
.bars{display:flex;gap:6px;margin-top:13px}
.bars i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .35s}
.lab{margin-top:10px;font:600 11px/1 ui-monospace,monospace;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(233,237,255,.4);transition:color .3s}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; forms</a>
  <span class="rt"><a href="02-live-validation.html" title="previous">&larr;</a><a href="04-otp.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Forms &middot; 03 / 15</p>
  <h1>Password Strength</h1>
  <p class="desc">Four segments scored on length and character variety, with a reveal toggle that keeps focus in the field.</p>
  <div class="demo block">
    <div class="pw">
      <input id="pass" type="password" placeholder="Choose a password">
      <button class="eye" id="eye" aria-label="show password">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="bars"><i></i><i></i><i></i><i></i></div>
    <div class="lab" id="lab">enter a password</div>
  </div>
  <p class="note">Score = length&nbsp;&ge;8, mixed case, a digit, a symbol at 10+ characters.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const pass=$('pass'), bars=document.querySelectorAll('.bars i'), lab=$('lab');
const TONE=['#ff5e79','#ff9a4d','#ffd23d','#4dffcf'], WORD=['too short','weak','decent','strong'];
pass.addEventListener('input',()=>{
  const v=pass.value; let s=0;
  if(v.length>=8) s++;
  if(/[a-z]/.test(v)&&/[A-Z]/.test(v)) s++;
  if(/[0-9]/.test(v)) s++;
  if(/[^A-Za-z0-9]/.test(v)&&v.length>=10) s++;
  if(!v.length) s=-1;
  bars.forEach((b,i)=>b.style.background = i<=s-1 ? TONE[s-1] : 'rgba(255,255,255,.1)');
  lab.textContent = s<0 ? 'enter a password' : WORD[Math.max(0,s-1)];
  lab.style.color = s<=0 ? 'rgba(233,237,255,.4)' : TONE[s-1];
});
$('eye').addEventListener('click',()=>{
  pass.type = pass.type==='password' ? 'text' : 'password'; pass.focus();
});
</script>
</body>
</html>
