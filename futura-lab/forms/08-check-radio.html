<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check &amp; Radio</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#7c5cff}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.opts{display:flex;flex-direction:column;gap:16px}
.cb{display:flex;align-items:center;gap:13px;cursor:pointer;font-size:14px;color:rgba(233,237,255,.78)}
.cb input{position:absolute;opacity:0;pointer-events:none}
.cb .box{width:24px;height:24px;border-radius:8px;border:1.7px solid rgba(255,255,255,.22);
  display:grid;place-items:center;transition:.28s cubic-bezier(.3,1.4,.4,1);flex:none}
.cb .box svg{width:14px;height:14px;fill:none;stroke:#07080f;stroke-width:3.2;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s}
.cb input:checked + .box{background:linear-gradient(130deg,#7c5cff,#31e0ff);border-color:transparent;
  transform:scale(1.07)}
.cb input:checked + .box svg{stroke-dashoffset:0}
.cb input:focus-visible + .box{box-shadow:0 0 0 4px rgba(124,92,255,.3)}
.radios{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.rp{position:relative;cursor:pointer}
.rp input{position:absolute;opacity:0}
.rp span{display:block;padding:11px 17px;border-radius:99px;font:600 13px/1 ui-sans-serif,system-ui;
  color:rgba(233,237,255,.55);background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);transition:.25s}
.rp input:checked + span{color:#07080f;background:linear-gradient(130deg,#fff,#c9d4ff);
  border-color:transparent;box-shadow:0 8px 20px -10px #fff}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; forms</a>
  <span class="rt"><a href="07-switches.html" title="previous">&larr;</a><a href="09-combobox.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Forms &middot; 08 / 15</p>
  <h1>Check &amp; Radio</h1>
  <p class="desc">The tick draws itself with a dash offset, and the radios are pills that invert when chosen.</p>
  <div class="demo block">
    <div class="opts">
      <label class="cb"><input type="checkbox" checked><span class="box"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>Ship with source maps</label>
      <label class="cb"><input type="checkbox"><span class="box"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>Minify the output bundle</label>
      <label class="cb"><input type="checkbox"><span class="box"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>Upload sourcemaps to Sentry</label>
      <div class="radios">
        <label class="rp"><input type="radio" name="pl" checked><span>Web</span></label>
        <label class="rp"><input type="radio" name="pl"><span>iOS</span></label>
        <label class="rp"><input type="radio" name="pl"><span>Android</span></label>
      </div>
    </div>
  </div>
  <p class="note">Real <b>&lt;input&gt;</b> elements underneath &mdash; keyboard and labels still work.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);

</script>
</body>
</html>
