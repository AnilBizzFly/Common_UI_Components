<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combobox</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#31e0ff}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.cbx{position:relative}
.sb{display:flex;align-items:center;gap:10px;padding:15px 16px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:.25s}
.cbx[data-open] .sb{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 13%,transparent)}
.sb svg{width:16px;height:16px;stroke:rgba(233,237,255,.4);fill:none;stroke-width:2;flex:none;
  transition:transform .3s}
.cbx[data-open] .sb svg{transform:rotate(180deg)}
.sb input{flex:1;min-width:0;border:0;background:none;outline:none;color:#fff;font:inherit;font-size:14.5px}
.list{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:9;padding:7px;border-radius:15px;
  background:#101324;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -22px #000;
  max-height:200px;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);
  transform-origin:top;transition:.25s cubic-bezier(.3,1.1,.3,1)}
.cbx[data-open] .list{opacity:1;visibility:visible;transform:none}
.list button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
  color:#dfe5ff;font:inherit;font-size:14px;text-align:left;padding:10px 11px;border-radius:11px;
  cursor:pointer;transition:background .15s}
.list button:hover,.list button[data-hi]{background:color-mix(in srgb,var(--c) 26%,transparent)}
.list i{width:8px;height:8px;border-radius:50%;flex:none}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; forms</a>
  <span class="rt"><a href="08-check-radio.html" title="previous">&larr;</a><a href="10-tag-input.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Forms &middot; 09 / 15</p>
  <h1>Combobox</h1>
  <p class="desc">Type to filter, arrow through the list, Enter to commit, Escape to dismiss &mdash; the keyboard path is the primary one.</p>
  <div class="demo block">
    <div class="cbx" id="cbx">
      <div class="sb">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        <input id="in" placeholder="Pick a framework&hellip;" autocomplete="off">
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <p class="note">Highlight index survives filtering; it clamps instead of going out of range.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const FW=[['React','#61dafb'],['Svelte','#ff3e00'],['Vue','#42b883'],['Solid','#4f88c6'],
          ['Qwik','#ac7ef4'],['Astro','#ff5d01'],['Lit','#325cff'],['Preact','#673ab8']];
const cbx=$('cbx'), input=$('in'), list=$('list'); let hi=0;
function draw(){
  const q=input.value.trim().toLowerCase();
  const items=FW.filter(f=>f[0].toLowerCase().includes(q));
  hi=Math.min(hi,Math.max(0,items.length-1));
  list.innerHTML = items.length
    ? items.map((f,i)=>'<button data-v="'+f[0]+'"'+(i===hi?' data-hi':'')+
        '><i style="background:'+f[1]+'"></i>'+f[0]+'</button>').join('')
    : '<button disabled style="opacity:.4">Nothing matches</button>';
  [...list.querySelectorAll('button[data-v]')].forEach(b=>
    b.addEventListener('click',()=>{ input.value=b.dataset.v; cbx.removeAttribute('data-open'); }));
}
input.addEventListener('focus',()=>{ cbx.setAttribute('data-open',''); draw(); });
input.addEventListener('input',()=>{ hi=0; draw(); });
input.addEventListener('blur',()=>setTimeout(()=>cbx.removeAttribute('data-open'),150));
input.addEventListener('keydown',e=>{
  const n=list.querySelectorAll('button[data-v]').length; if(!n) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); hi=(hi+1)%n; draw(); }
  if(e.key==='ArrowUp'){ e.preventDefault(); hi=(hi-1+n)%n; draw(); }
  if(e.key==='Enter'){ const b=list.querySelector('button[data-hi]');
    if(b){ input.value=b.dataset.v; cbx.removeAttribute('data-open'); input.blur(); } }
  if(e.key==='Escape') cbx.removeAttribute('data-open');
});
draw();
</script>
</body>
</html>
