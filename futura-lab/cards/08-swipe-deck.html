<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swipe Deck</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:74px 20px 64px;
  overflow-x:hidden;font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e9edff;background:#06070d;--c:#ff5fa8}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(105px);
  pointer-events:none;z-index:0}
body::before{width:54vmax;height:54vmax;left:-20vmax;top:-24vmax;
  background:color-mix(in srgb,var(--c) 30%,transparent)}
body::after{width:46vmax;height:46vmax;right:-18vmax;bottom:-22vmax;background:rgba(0,190,255,.16)}

.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:16px 18px;
  font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}
.bar a{color:rgba(233,237,255,.4);text-decoration:none;padding:8px 11px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.22s}
.bar a:hover{color:#fff;border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar .rt{display:flex;gap:8px}

.stage{position:relative;z-index:1;width:min(460px,100%);text-align:center}
.eyebrow{margin:0 0 10px;font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#8890b8)}
h1{margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:650;letter-spacing:-.04em}
.desc{margin:0;font-size:13.5px;color:rgba(233,237,255,.48);line-height:1.6}

.demo{margin:24px 0 0;padding:40px 22px;border-radius:26px;min-height:176px;position:relative;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 26px 60px -30px #000,0 1px 0 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.demo.block{display:block;text-align:left;padding:26px 22px}
.demo.bare{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:14px 0}

.note{margin:14px 0 0;font:500 11px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  color:rgba(233,237,255,.32)}
.note b{color:color-mix(in srgb,var(--c) 75%,#fff);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

.deck{position:relative;width:min(300px,100%);height:236px}
.sw{position:absolute;inset:0;border-radius:22px;padding:20px;cursor:grab;user-select:none;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  border:1px solid rgba(255,255,255,.13);box-shadow:0 28px 64px -26px #000;
  transition:transform .45s cubic-bezier(.3,1.1,.3,1),opacity .35s;touch-action:none}
.sw:active{cursor:grabbing}
.stampY,.stampN{position:absolute;top:20px;padding:7px 13px;border-radius:10px;
  font:800 14px/1 ui-monospace,monospace;letter-spacing:.18em;opacity:0;transition:opacity .15s}
.stampY{left:20px;color:#4dffcf;border:2px solid #4dffcf;transform:rotate(-12deg)}
.stampN{right:20px;color:#ff5e79;border:2px solid #ff5e79;transform:rotate(12deg)}
.k{font:600 8.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(233,237,255,.45)}
.sw h3{margin:8px 0 0;font-size:21px;font-weight:650;letter-spacing:-.035em}
</style>
</head>
<body>
<nav class="bar">
  <a href="index.html">&larr; cards</a>
  <span class="rt"><a href="07-weather.html" title="previous">&larr;</a><a href="09-border-beam.html" title="next">&rarr;</a></span>
</nav>

<main class="stage">
  <p class="eyebrow">Cards &middot; 08 / 12</p>
  <h1>Swipe Deck</h1>
  <p class="desc">Drag the top card. Past 90px it flies off with rotation and recycles to the bottom of the stack.</p>
  <div class="demo">
    <div class="deck" id="deck"></div>
  </div>
  <p class="note">LIKE / NOPE opacity is tied directly to drag distance &mdash; <b>dx / 90</b>.</p>
</main>
<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
const DATA=[
  ['Orbital Ring','#3b1f6e','#0f2a56','Structural concept &middot; 2031'],
  ['Deep Current','#0b4a4f','#08202e','Hydro grid study'],
  ['Solar Veil','#5d1d33','#2a0a20','Thermal shielding'],
  ['Night Atlas','#1b2450','#0a0d1c','Cartography engine']
];
const deck=$('deck');
const top=()=>[...deck.querySelectorAll('.sw')].pop();
DATA.forEach(d=>{
  const el=document.createElement('div'); el.className='sw';
  el.style.background='linear-gradient(160deg,'+d[1]+','+d[2]+')';
  el.innerHTML='<span class="stampY">LIKE</span><span class="stampN">NOPE</span>'+
    '<span class="k">'+d[3]+'</span><h3>'+d[0]+'</h3>';
  deck.appendChild(el);
});
function layout(){
  const all=[...deck.querySelectorAll('.sw')];
  all.forEach((c,i)=>{
    const depth=all.length-1-i;
    c.style.transform='translateY('+(depth*-10)+'px) scale('+(1-depth*.045)+')';
    c.style.opacity = depth>2 ? 0 : 1;
    c.style.zIndex = i+1;
  });
}
function arm(card){
  let sx=0, dx=0, down=false;
  const y=card.querySelector('.stampY'), n=card.querySelector('.stampN');
  card.addEventListener('pointerdown',e=>{
    down=true; sx=e.clientX; card.style.transition='none'; card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove',e=>{
    if(!down) return;
    dx=e.clientX-sx;
    card.style.transform='translateX('+dx+'px) rotate('+(dx*.06)+'deg)';
    y.style.opacity=Math.max(0,Math.min(1,dx/90));
    n.style.opacity=Math.max(0,Math.min(1,-dx/90));
  });
  card.addEventListener('pointerup',()=>{
    if(!down) return; down=false; card.style.transition='';
    if(Math.abs(dx)>90){
      const dir=Math.sign(dx);
      card.style.transform='translateX('+(dir*620)+'px) rotate('+(dir*30)+'deg)';
      card.style.opacity=0;
      setTimeout(()=>{
        deck.insertBefore(card,deck.firstChild);
        card.style.transition='none'; card.style.opacity=1;
        y.style.opacity=n.style.opacity=0;
        layout();
        requestAnimationFrame(()=>{ card.style.transition=''; });
      },340);
    }else{ layout(); y.style.opacity=n.style.opacity=0; }
    dx=0;
  });
}
layout();
deck.querySelectorAll('.sw').forEach(arm);
</script>
</body>
</html>
