<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Husky Sign in</title>
<style>
:root{
  --bg:#0d1120;
  --card:#171d31; --line:rgba(255,255,255,.09);
  --txt:#e9edf8; --muted:#8b95b3;
  --accent:#6d8cff; --accent2:#b06dff;
  --fur:#5a6580; --fur-dk:#414a60; --cream:#f5f8fe;
  --pink:#efa2b0; --ink:#252b3b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:grid; place-items:center; padding:24px;
  font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt); background:var(--bg); overflow:hidden;
}
body::before,body::after{
  content:""; position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0;
}
body::before{width:520px;height:520px;background:rgba(109,140,255,.20);top:-160px;left:-120px}
body::after{width:460px;height:460px;background:rgba(176,109,255,.16);bottom:-180px;right:-120px}

/* ---------- card ---------- */
.card{
  position:relative; z-index:1; width:min(370px,100%);
  background:linear-gradient(180deg,var(--card),#131829);
  border:1px solid var(--line); border-radius:22px;
  padding:78px 28px 26px; margin-top:70px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03) inset;
}
.card.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em;text-align:center}
.sub{margin:0 0 24px;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- husky ---------- */
.fox-wrap{
  position:absolute; top:-72px; left:50%; transform:translateX(-50%);
  width:180px; height:144px; pointer-events:none;
}
.fox{width:100%;height:100%;overflow:hidden;display:block;animation:bob 4.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fox.is-happy .fox_all{animation:hop .52s ease 2}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-9px) scale(1.04,.97)}70%{transform:translateY(0) scale(.98,1.03)}}

.fox_head{fill:var(--fur)}
.fox_ear{fill:var(--fur-dk)}
.fox_ear-in{fill:var(--pink);opacity:.55}
.fox_mask,.fox_muzzle{fill:var(--cream)}
.fox_eye{fill:#fff}
.fox_pupils{transform:translate(var(--px,0px),var(--py,0px));transition:transform .2s ease-out}
.fox_pupil{fill:var(--ink)}
.fox_spark{fill:#fff}
.fox_lid{fill:var(--fur);transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.4s infinite}
.fox_lid--b{animation-delay:.04s}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
.fox_brow{fill:none;stroke:var(--fur-dk);stroke-width:4;stroke-linecap:round;opacity:.8;transition:transform .3s}
.fox_nose{fill:var(--ink)}
.fox_mouth{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fox_tongue{fill:var(--pink);transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .3s cubic-bezier(.34,1.5,.5,1)}
.fox_smile{fill:none;stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;opacity:0;transition:opacity .2s}

/* eyes squish shut + tongue out when he's let you through */
.fox.is-happy .fox_eyes{opacity:0}
.fox.is-happy .fox_smile{opacity:1}
.fox.is-happy .fox_tongue{transform:scaleY(1)}
.fox.is-happy .fox_lid{animation:none}
.fox.is-happy .fox_brow{transform:translateY(-3px)}

/* paws: parked below the frame, swing up to cover the eyes */
.fox_arm{transform:translateY(96px);transition:transform .44s cubic-bezier(.34,1.42,.5,1)}
.fox_arm--r{transition-delay:.05s}
.fox_forearm,.fox_paw{fill:var(--fur)}
.fox_toe{fill:var(--fur-dk);opacity:.55}
.fox_pawg{transform-box:fill-box;transform-origin:50% 50%;transition:transform .4s cubic-bezier(.34,1.42,.5,1)}
.fox.is-hiding .fox_arm{transform:translateY(0)}
.fox.is-hiding.is-peeking .fox_arm{transform:translateY(19px)}
.fox.is-hiding.is-peeking .fox_arm--l .fox_pawg{transform:rotate(-13deg)}
.fox.is-hiding.is-peeking .fox_arm--r .fox_pawg{transform:rotate(13deg)}

/* ---------- fields ---------- */
.field{display:block;margin-bottom:14px}
.field__lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.f-wrap{position:relative;display:flex;align-items:center}
.f-wrap>svg{position:absolute;left:13px;width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .2s}
.inp{
  width:100%; padding:12px 14px 12px 40px; font:inherit; font-size:14px; color:var(--txt);
  background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px;
  outline:none; transition:border-color .2s,background .2s,box-shadow .2s;
}
.inp::placeholder{color:#5d6784}
.inp:focus{border-color:var(--accent);background:rgba(109,140,255,.07);box-shadow:0 0 0 3px rgba(109,140,255,.15)}
.f-wrap:focus-within>svg{stroke:var(--accent)}
.inp.pad{padding-right:44px}
.field.bad .inp{border-color:#ff6b81;box-shadow:0 0 0 3px rgba(255,107,129,.14)}

.peek{
  position:absolute;right:6px;display:grid;place-items:center;width:32px;height:32px;
  background:none;border:0;border-radius:9px;cursor:pointer;color:var(--muted);transition:color .2s,background .2s;
}
.peek:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.peek.on{color:var(--accent)}
.peek svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.peek .off{display:none}
.peek.on .off{display:block}
.peek.on .on-i{display:none}

.row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 20px;font-size:12.5px}
.cbx{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;user-select:none}
.cbx input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
a.lnk{color:var(--accent);font-weight:600;text-decoration:none}
a.lnk:hover{text-decoration:underline}

/* ---------- door button ---------- */
.btn.doorbtn{
  position:relative; display:flex; align-items:center; justify-content:center; gap:12px;
  width:100%; padding:13px 16px; font:inherit; font-size:14.5px; font-weight:650; color:#fff;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  border:0; border-radius:13px; cursor:pointer; overflow:hidden;
  box-shadow:0 10px 26px -8px rgba(109,140,255,.65);
  transition:transform .16s,box-shadow .2s;
}
.btn.doorbtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 30px -8px rgba(109,140,255,.75)}
.btn.doorbtn:active:not(:disabled){transform:translateY(1px)}
.btn.doorbtn:disabled{cursor:default}
.doorbtn_label{transition:opacity .3s}
.btn.dooropen .doorbtn_label{opacity:.5}

.dooric{position:relative;width:24px;height:30px;perspective:200px;flex:0 0 auto}
.dooric_frame{position:absolute;inset:0;border:2px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0;opacity:.9}
.dooric_glow{
  position:absolute;inset:2px 2px 0;border-radius:2px 2px 0 0;opacity:0;
  background:linear-gradient(180deg,#fff3cf,#ffb75e);
  box-shadow:0 0 14px 3px rgba(255,196,105,.75);
  transition:opacity .34s ease;
}
.dooric_panel{
  position:absolute;inset:2px 2px 0;border-radius:2px 2px 0 0;
  background:linear-gradient(90deg,#eef2fb,#bcc7e2);
  transform-origin:left center;transform:rotateY(0deg);
  transition:transform .44s cubic-bezier(.32,.78,.28,1);
  box-shadow:1px 0 4px rgba(0,0,0,.28) inset;
}
.dooric_panel::after{content:"";position:absolute;right:3px;top:50%;width:2.5px;height:2.5px;border-radius:50%;background:#5b6784}

/* the door swings open */
.btn.dooropen .dooric_panel{transform:rotateY(72deg)}
.btn.dooropen .dooric_glow{opacity:.95}

.dooric_person{
  position:absolute;left:-13px;bottom:0;width:15px;height:23px;
  transition:transform .76s linear,opacity .76s linear;
}
.dooric_person svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;overflow:visible}

/* then walk on through */
.btn.out .dooric_person{transform:translateX(34px) scale(.82);opacity:0}

/* legs swing, knees bend */
.leg,.arm,.shin{transform-box:fill-box;transform-origin:50% 0}
.btn.walking .leg--front{animation:thighF .46s linear infinite}
.btn.walking .leg--back{animation:thighB .46s linear infinite}
.btn.walking .leg--front .shin{animation:shinF .46s linear infinite}
.btn.walking .leg--back .shin{animation:shinB .46s linear infinite}
.btn.walking .arm--front{animation:thighB .46s linear infinite}
.btn.walking .arm--back{animation:thighF .46s linear infinite}
.btn.walking .torso{animation:bobW .23s linear infinite}
@keyframes thighF{0%{transform:rotate(26deg)}50%{transform:rotate(-24deg)}100%{transform:rotate(26deg)}}
@keyframes thighB{0%{transform:rotate(-24deg)}50%{transform:rotate(26deg)}100%{transform:rotate(-24deg)}}
@keyframes shinF{0%{transform:rotate(2deg)}30%{transform:rotate(38deg)}60%{transform:rotate(16deg)}100%{transform:rotate(2deg)}}
@keyframes shinB{0%{transform:rotate(20deg)}30%{transform:rotate(4deg)}60%{transform:rotate(40deg)}100%{transform:rotate(20deg)}}
@keyframes bobW{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}
.no-anim .dooric_person{transition:none!important}

.note{
  margin:14px 0 0;text-align:center;font-size:12.5px;font-weight:600;color:#7ee2b8;
  opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s;min-height:18px;
}
.note.show{opacity:1;transform:none}
.foot{margin:18px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .fox,.fox_lid,.btn.walking *{animation:none!important}
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>

<form class="card" id="form" novalidate autocomplete="off">

  <div class="fox-wrap">
    <!-- the husky guards -->
    <svg class="fox" id="fox" viewBox="0 0 200 160" aria-hidden="true">
      <g class="fox_all">
        <!-- ears -->
        <path class="fox_ear" d="M66 54 L73 13 L98 45 Z"/>
        <path class="fox_ear" d="M134 54 L127 13 L102 45 Z"/>
        <path class="fox_ear-in" d="M73 49 L77 26 L89 45 Z"/>
        <path class="fox_ear-in" d="M127 49 L123 26 L111 45 Z"/>
        <!-- head -->
        <ellipse class="fox_head" cx="100" cy="80" rx="46" ry="42"/>
        <!-- husky mask, split by the dark stripe -->
        <path class="fox_mask" d="M97 48 C84 51 71 65 69 84 C67 101 78 115 95 118 C97 100 97 68 97 48 Z"/>
        <path class="fox_mask" d="M103 48 C116 51 129 65 131 84 C133 101 122 115 105 118 C103 100 103 68 103 48 Z"/>
        <!-- brows -->
        <path class="fox_brow" d="M74 63 Q83 58 92 62"/>
        <path class="fox_brow" d="M126 63 Q117 58 108 62"/>
        <!-- eyes -->
        <g class="fox_eyes">
          <ellipse class="fox_eye" cx="83" cy="80" rx="10" ry="11"/>
          <ellipse class="fox_eye" cx="117" cy="80" rx="10" ry="11"/>
          <g class="fox_pupils">
            <circle class="fox_pupil" cx="83" cy="81" r="5.6"/>
            <circle class="fox_pupil" cx="117" cy="81" r="5.6"/>
            <circle class="fox_spark" cx="85.4" cy="78" r="2"/>
            <circle class="fox_spark" cx="119.4" cy="78" r="2"/>
          </g>
          <ellipse class="fox_lid" cx="83" cy="80" rx="10.4" ry="11.4"/>
          <ellipse class="fox_lid fox_lid--b" cx="117" cy="80" rx="10.4" ry="11.4"/>
        </g>
        <!-- happy squint -->
        <path class="fox_smile" d="M74 83 Q83 71 92 83"/>
        <path class="fox_smile" d="M108 83 Q117 71 126 83"/>
        <!-- muzzle -->
        <ellipse class="fox_muzzle" cx="100" cy="104" rx="21" ry="15"/>
        <ellipse class="fox_tongue" cx="100" cy="110" rx="7.5" ry="7"/>
        <ellipse class="fox_nose" cx="100" cy="95" rx="8" ry="6.2"/>
        <path class="fox_mouth" d="M100 101 L100 105 M100 105 Q93 112 87 105 M100 105 Q107 112 113 105"/>

        <!-- paws: parked below, swing up over the eyes -->
        <g class="fox_arm fox_arm--l">
          <path class="fox_forearm" d="M56 210 C50 152 56 106 76 90 L92 104 C74 116 70 158 74 210 Z"/>
          <g class="fox_pawg">
            <ellipse class="fox_paw" cx="83" cy="82" rx="18" ry="15"/>
            <circle class="fox_toe" cx="72" cy="72" r="4.4"/>
            <circle class="fox_toe" cx="83" cy="68" r="4.6"/>
            <circle class="fox_toe" cx="94" cy="72" r="4.4"/>
          </g>
        </g>
        <g class="fox_arm fox_arm--r">
          <path class="fox_forearm" d="M144 210 C150 152 144 106 124 90 L108 104 C126 116 130 158 126 210 Z"/>
          <g class="fox_pawg">
            <ellipse class="fox_paw" cx="117" cy="82" rx="18" ry="15"/>
            <circle class="fox_toe" cx="106" cy="72" r="4.4"/>
            <circle class="fox_toe" cx="117" cy="68" r="4.6"/>
            <circle class="fox_toe" cx="128" cy="72" r="4.4"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <h1>Welcome back</h1>
  <p class="sub">Your password is safe &mdash; he won&rsquo;t peek.</p>

  <label class="field" id="f-user">
    <span class="field__lab">Username</span>
    <span class="f-wrap">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input class="inp" id="user" type="text" placeholder="husky.fan" autocomplete="username">
    </span>
  </label>

  <label class="field" id="f-pw">
    <span class="field__lab">Password</span>
    <span class="f-wrap">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input class="inp pad" id="pw" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
      <button class="peek" id="toggle" type="button" aria-label="Show password">
        <svg class="on-i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.6M6.6 6.9A17 17 0 0 0 2 12s3.6 6 10 6a9.7 9.7 0 0 0 4.2-.9"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </span>
  </label>

  <div class="row">
    <label class="cbx"><input type="checkbox" checked> Keep me signed in</label>
    <a class="lnk" href="#" onclick="return false">Forgot?</a>
  </div>

  <!-- Sign in is a door -->
  <button class="btn doorbtn" id="btn" type="submit">
    <span class="doorbtn_label">Sign in</span>
    <span class="dooric" aria-hidden="true">
      <span class="dooric_frame"></span>
      <span class="dooric_glow"></span>
      <span class="dooric_panel"></span>
      <span class="dooric_person">
        <svg viewBox="0 0 15 23">
          <g class="torso">
            <circle cx="7.5" cy="3.4" r="2.9"/>
            <path d="M7.5 6.3 V13.6"/>
            <g class="arm arm--back"><path d="M7.5 8 V12.6"/></g>
            <g class="arm arm--front"><path d="M7.5 8 V12.6"/></g>
            <g class="leg leg--back"><path d="M7.5 13.6 V17.9"/><g class="shin"><path d="M7.5 17.9 V22.2"/></g></g>
            <g class="leg leg--front"><path d="M7.5 13.6 V17.9"/><g class="shin"><path d="M7.5 17.9 V22.2"/></g></g>
          </g>
        </svg>
      </span>
    </span>
  </button>

  <p class="note" id="note"></p>
  <p class="foot">New here? <a class="lnk" href="#" onclick="return false">Create an account</a></p>
</form>

<script>
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));

const fox = $('#fox'), form = $('#form'), btn = $('#btn'), note = $('#note'),
      user = $('#user'), pw = $('#pw'), toggle = $('#toggle');

/* ---- eyes follow what you type ---- */
function setPupils(x, y){
  fox.style.setProperty('--px', x.toFixed(2) + 'px');
  fox.style.setProperty('--py', y.toFixed(2) + 'px');
}
function track(){
  if (fox.classList.contains('is-hiding')) return;
  if (document.activeElement !== user){ setPupils(0, 0); return; }
  const ratio = Math.min(1, user.value.length / 22);
  setPupils(-3 + ratio * 6, 1.6);
}
user.addEventListener('input', track);
user.addEventListener('focus', track);
user.addEventListener('blur', () => setPupils(0, 0));

/* ---- password: paws up ---- */
pw.addEventListener('focus', () => fox.classList.add('is-hiding'));
pw.addEventListener('blur', () => {
  fox.classList.remove('is-hiding', 'is-peeking');
  toggle.classList.remove('on');
  toggle.setAttribute('aria-label', 'Show password');
  pw.type = 'password';
  track();
});

/* ---- peek toggle: he parts the paws too ---- */
toggle.addEventListener('mousedown', e => e.preventDefault());
toggle.addEventListener('click', () => {
  const showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  toggle.classList.toggle('on', !showing);
  toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  fox.classList.toggle('is-peeking', !showing);
  pw.focus();
});

/* ---- door walk through ---- */
let busy = false;
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;

  const badUser = !user.value.trim(), badPw = !pw.value;
  $('#f-user').classList.toggle('bad', badUser);
  $('#f-pw').classList.toggle('bad', badPw);
  if (badUser || badPw){
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    (badUser ? user : pw).focus();
    return;
  }

  busy = true;
  btn.disabled = true;
  pw.blur();
  fox.classList.remove('is-hiding', 'is-peeking');

  btn.classList.add('dooropen');
  await wait(380);
  btn.classList.add('walking');
  btn.classList.add('out');
  await wait(760);                          // walk
  btn.classList.remove('walking', 'dooropen');
  fox.classList.add('is-happy');

  note.textContent = 'Welcome back, ' + user.value.trim() + ' 🐺';
  note.classList.add('show');

  await wait(2000);                         // reset, replayable
  btn.classList.add('no-anim');
  btn.classList.remove('out');
  void btn.offsetWidth;
  btn.classList.remove('no-anim');
  fox.classList.remove('is-happy');
  note.classList.remove('show');
  btn.disabled = false;
  busy = false;
});

[user, pw].forEach(el => el.addEventListener('input', () => {
  el.closest('.field').classList.remove('bad');
}));
</script>
</body>
</html>
